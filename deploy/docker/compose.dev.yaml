# Development stack for the MemoBrain Notes Cloud Service: PostgreSQL, an S3-compatible
# object store (RustFS: MinIO-compatible, Apache-2.0; MinIO images are no longer
# publicly pullable) and Keycloak. The cloud service itself runs on the host
# (`make dev-cloud`) with deploy/docker/cloud.dev.env.
name: memobrain-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: memobrain
      POSTGRES_PASSWORD: memobrain
      POSTGRES_DB: memobrain
    ports:
      - '5433:5432' # 5433 on the host: 5432 is often taken by a local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memobrain -d memobrain']
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: memobrain
      RUSTFS_SECRET_KEY: memobrain-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - s3data:/data
    healthcheck:
      # The S3 root answers 403 without credentials: any HTTP answer means the server is up.
      test:
        [
          'CMD-SHELL',
          "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ | grep -qE '^(200|403)$$'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: memobrain
      AWS_SECRET_ACCESS_KEY: memobrain-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
    entrypoint: >
      /bin/sh -c "
        for b in memobrain-blobs memobrain-exports; do
          aws --endpoint-url http://s3:9000 s3api head-bucket --bucket $$b >/dev/null 2>&1 ||
          aws --endpoint-url http://s3:9000 s3 mb s3://$$b;
        done && echo buckets ready
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ['start-dev', '--import-realm', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: 'false'
    ports:
      - '8080:8080'
      - '9002:9000' # management port (health/metrics)
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3 | grep -q 200",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
  s3data:
