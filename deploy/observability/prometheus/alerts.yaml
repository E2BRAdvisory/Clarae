# Esempio di regole di alerting per il servizio cloud (Prometheus / Alertmanager).
# Le metriche sono quelle esposte da `GET /metrics` (services/cloud/internal/observability).
# Adattare soglie, `for:` e label di routing al proprio ambiente; ogni alert rimanda al runbook
# in docs/admin-guide/runbook.md (sezione indicata in `runbook`).
# Validazione: promtool check rules deploy/observability/prometheus/alerts.yaml
groups:
  - name: memobrain-availability
    rules:
      - alert: MemobrainDown
        expr: up{job=~"memobrain.*"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Istanza {{ $labels.instance }} non raggiungibile'
          description: 'Prometheus non riesce a leggere /metrics da {{ $labels.instance }} da 2 minuti.'
          runbook: 'docs/admin-guide/runbook.md#il-servizio-non-risponde-o-il-database-è-giù'

      - alert: MemobrainHighErrorRate
        expr: |
          100 * sum(rate(memobrain_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(memobrain_http_requests_total[5m])), 1e-9) > 5
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'Più del 5% di risposte 5xx'
          description: 'Il tasso di errori 5xx è {{ $value | printf "%.1f" }}% negli ultimi 5 minuti.'
          runbook: 'docs/admin-guide/runbook.md#il-servizio-non-risponde-o-il-database-è-giù'

      - alert: MemobrainHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(memobrain_http_request_duration_seconds_bucket[5m]))) > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Latenza p95 sopra 2 s'
          description: 'La latenza p95 dell''API è {{ $value | printf "%.2f" }} s.'
          runbook: 'docs/admin-guide/runbook.md#la-sincronizzazione-è-bloccata-o-lenta'

      - alert: MemobrainAuthFailuresSpike
        expr: |
          sum(rate(memobrain_http_requests_total{status=~"401|403"}[5m])) > 1
            and
          sum(rate(memobrain_http_requests_total{status=~"401|403"}[5m]))
            / clamp_min(sum(rate(memobrain_http_requests_total[5m])), 1e-9) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Molte risposte 401/403'
          description: 'Oltre il 20% delle richieste è rifiutato per autenticazione: controllare Keycloak, orologi e OIDC_ISSUER.'
          runbook: 'docs/admin-guide/runbook.md#il-login-non-funziona'

  - name: memobrain-sync
    rules:
      - alert: MemobrainSyncCommitErrors
        expr: |
          sum(rate(memobrain_sync_commits_total{outcome="error"}[10m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Commit di sync che falliscono'
          description: 'Commit falliti per intero a {{ $value | printf "%.2f" }}/s: database o storage in difficoltà.'
          runbook: 'docs/admin-guide/runbook.md#la-sincronizzazione-è-bloccata-o-lenta'

      - alert: MemobrainSyncRejectedOps
        expr: |
          sum(rate(memobrain_sync_ops_total{status="rejected"}[15m]))
            / clamp_min(sum(rate(memobrain_sync_ops_total[15m])), 1e-9) > 0.2
        for: 30m
        labels: { severity: info }
        annotations:
          summary: 'Molte operazioni di sync rifiutate'
          description: 'Più del 20% delle operazioni è rifiutato (quota, path non validi, vault in sola lettura).'
          runbook: 'docs/admin-guide/runbook.md#quota-esaurita'

  # Le metriche dei job hanno un'etichetta `job` (il nome del job), che coincide con l'etichetta di
  # target di Prometheus: senza `honor_labels: true` lo scraping la rinomina in `exported_job`. Le regole
  # seguenti funzionano in entrambi i casi (`label_replace` o un selettore per ciascuna etichetta).
  # I job girano nei processi `--role=worker` (porta interna METRICS_LISTEN_ADDR, :18083) o `--role=all`.
  - name: memobrain-jobs
    rules:
      - alert: MemobrainJobFailing
        expr: |
          sum by (job) (
            label_replace(increase(memobrain_jobs_runs_total{result="error"}[1h]), "job", "$1", "exported_job", "(.+)")
          ) >= 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Il job {{ $labels.job }} fallisce ripetutamente'
          description: "{{ $value }} errori nell'ultima ora."
          runbook: 'docs/admin-guide/runbook.md#gli-export-restano-in-coda'

      - alert: MemobrainExportJobStale
        expr: |
          time() - max(
            memobrain_jobs_last_success_timestamp_seconds{job="exports"}
              or memobrain_jobs_last_success_timestamp_seconds{exported_job="exports"}
          ) > 600
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Il job degli export non ha successi da oltre 10 minuti'
          description: 'Controllare che almeno una replica con `--role=worker` o `--role=all` sia attiva.'
          runbook: 'docs/admin-guide/runbook.md#gli-export-restano-in-coda'

      - alert: MemobrainMaintenanceStale
        expr: |
          time() - max(
            memobrain_jobs_last_success_timestamp_seconds{job="maintenance"}
              or memobrain_jobs_last_success_timestamp_seconds{exported_job="maintenance"}
          ) > 2 * 86400
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: 'Manutenzione giornaliera ferma da oltre 2 giorni'
          description: 'Compattazione, purge dei vault eliminati e riconciliazione dei contatori non girano.'
          runbook: 'docs/admin-guide/runbook.md#gli-export-restano-in-coda'

      # Le regole "stale" non scattano se la serie manca del tutto (worker spento, non raccolto da
      # Prometheus, o job mai riuscito dall'avvio): queste due coprono l'assenza.
      - alert: MemobrainJobMetricsAbsent
        expr: absent(memobrain_jobs_runs_total)
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'Nessun processo worker raccolto da Prometheus'
          description: "Nessuna metrica dei job da 15 minuti (ogni job parte entro un minuto dall'avvio): il worker è giù o Prometheus non raccoglie la sua porta interna (METRICS_LISTEN_ADDR, :18083)."
          runbook: 'docs/admin-guide/runbook.md#gli-export-restano-in-coda'

      - alert: MemobrainJobNeverSucceeded
        expr: |
          (absent(memobrain_jobs_last_success_timestamp_seconds{job="blob-gc"})
            and on() absent(memobrain_jobs_last_success_timestamp_seconds{exported_job="blob-gc"}))
          or (absent(memobrain_jobs_last_success_timestamp_seconds{job="uploads"})
            and on() absent(memobrain_jobs_last_success_timestamp_seconds{exported_job="uploads"}))
          or (absent(memobrain_jobs_last_success_timestamp_seconds{job="retention"})
            and on() absent(memobrain_jobs_last_success_timestamp_seconds{exported_job="retention"}))
          or (absent(memobrain_jobs_last_success_timestamp_seconds{job="maintenance"})
            and on() absent(memobrain_jobs_last_success_timestamp_seconds{exported_job="maintenance"}))
          or (absent(memobrain_jobs_last_success_timestamp_seconds{job="exports"})
            and on() absent(memobrain_jobs_last_success_timestamp_seconds{exported_job="exports"}))
        for: 2h
        labels: { severity: warning }
        annotations:
          summary: 'Il job {{ $labels.job }} non risulta mai riuscito'
          description: 'Nessun successo del job da quando il worker è stato avviato (o il worker non è raccolto): controllare i log `job failed`.'
          runbook: 'docs/admin-guide/runbook.md#gli-export-restano-in-coda'

  - name: memobrain-database
    rules:
      - alert: MemobrainDbPoolSaturated
        expr: |
          100 * max(memobrain_db_pool_connections{state="acquired"})
            / max(memobrain_db_pool_connections{state="max"}) > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Pool di connessioni al database quasi esaurito'
          description: 'Connessioni acquisite al {{ $value | printf "%.0f" }}% del massimo.'
          runbook: 'docs/admin-guide/runbook.md#il-servizio-non-risponde-o-il-database-è-giù'

      - alert: MemobrainDbPoolWaiting
        expr: rate(memobrain_db_pool_empty_acquires_total[5m]) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Le richieste attendono una connessione al database'
          description: 'Acquisizioni con pool vuoto: {{ $value | printf "%.1f" }}/s.'
          runbook: 'docs/admin-guide/runbook.md#il-servizio-non-risponde-o-il-database-è-giù'
