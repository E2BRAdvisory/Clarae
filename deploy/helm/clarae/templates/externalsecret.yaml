{{- if and .Values.externalSecret.enabled (not .Values.secret.existingSecret) }}
# Requires the External Secrets Operator CRDs; the resulting Secret has the name of the release.
apiVersion: {{ .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "clarae.fullname" . }}
  labels: {{- include "clarae.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "clarae.fullname" . }}
    creationPolicy: Owner
  data: {{- required "externalSecret.data must list the secret keys" .Values.externalSecret.data | toYaml | nindent 4 }}
{{- end }}
