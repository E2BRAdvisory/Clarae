{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clarae.fullname" . }}-api
  labels: {{- include "clarae.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "clarae.selector" (dict "root" . "role" "api") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ .Values.service.httpPort }} }
        - { protocol: TCP, port: {{ .Values.service.grpcPort }} }
    {{- with .Values.networkPolicy.metricsFrom }}
    # Prometheus scraping /metrics
    - from: {{- toYaml . | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $.Values.service.httpPort }} }
    {{- end }}
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    - ports: # DNS
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- with .Values.networkPolicy.egressTo }}
    - to: {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- end }}
{{- if .Values.networkPolicy.restrictEgress }}
---
# The worker's only inbound traffic is the scrape of its metrics port (kubelet probes are not subject to
# network policies); outbound follows the same rule as the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clarae.fullname" . }}-worker
  labels: {{- include "clarae.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "clarae.selector" (dict "root" . "role" "worker") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- with .Values.networkPolicy.metricsFrom }}
  ingress:
    - from: {{- toYaml . | nindent 8 }}
      ports:
        - { protocol: TCP, port: {{ $.Values.worker.metricsPort }} }
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- with .Values.networkPolicy.egressTo }}
    - to: {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
