apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nodus.fullname" . }}
  labels: {{- include "nodus.labels" . | nindent 4 }}
data:
  LISTEN_ADDR: "0.0.0.0:{{ .Values.service.httpPort }}"
  GRPC_LISTEN_ADDR: "0.0.0.0:{{ .Values.service.grpcPort }}"
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- if not .Values.secret.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nodus.fullname" . }}
  labels: {{- include "nodus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
