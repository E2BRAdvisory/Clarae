apiVersion: v1
kind: Service
metadata:
  name: {{ include "nodus.fullname" . }}
  labels: {{- include "nodus.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "nodus.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      appProtocol: grpc
