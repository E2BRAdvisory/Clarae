image:
  repository: ghcr.io/ORG/nodus-cloud # set when the registry is decided (M7)
  tag: ''
  pullPolicy: IfNotPresent

api:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: '1', memory: 512Mi }

worker:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Non-secret configuration (environment variables of the binary).
config:
  OIDC_ISSUER: https://auth.example.com/realms/nodus
  OIDC_AUDIENCE: nodus-api
  OIDC_ALLOWED_AZP: nodus-desktop,nodus-web
  S3_ENDPOINT: https://s3.example.com
  S3_REGION: us-east-1
  S3_BUCKET_BLOBS: nodus-blobs
  S3_BUCKET_EXPORTS: nodus-exports
  S3_USE_PATH_STYLE: 'true'
  KC_ADMIN_BASE_URL: https://auth.example.com
  KC_REALM: nodus
  KC_ADMIN_CLIENT_ID: nodus-admin-svc
  WEB_UI_ORIGIN: https://nodus.example.com
  LOG_LEVEL: info

# Secrets: either reference an existing Secret (recommended) or let the chart create one.
secret:
  existingSecret: ''
  values:
    DATABASE_URL: postgres://nodus:change-me@postgres:5432/nodus?sslmode=require
    S3_ACCESS_KEY: ''
    S3_SECRET_KEY: ''
    KC_ADMIN_CLIENT_SECRET: ''

service:
  type: ClusterIP
  httpPort: 18081
  grpcPort: 18082

ingress:
  enabled: true
  className: nginx
  host: nodus.example.com
  tls:
    enabled: true
    secretName: nodus-tls
  annotations: {}
  # gRPC needs HTTP/2 end to end; the notify stream is exposed on a dedicated host.
  grpcHost: notify.nodus.example.com

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile: { type: RuntimeDefault }
