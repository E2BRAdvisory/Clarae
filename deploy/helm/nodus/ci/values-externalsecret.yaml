externalSecret:
  enabled: true
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  data:
    - { secretKey: DATABASE_URL, remoteRef: { key: nodus/prod, property: database_url } }
    - { secretKey: S3_ACCESS_KEY, remoteRef: { key: nodus/prod, property: s3_access_key } }
    - { secretKey: S3_SECRET_KEY, remoteRef: { key: nodus/prod, property: s3_secret_key } }
    - { secretKey: KC_ADMIN_CLIENT_SECRET, remoteRef: { key: nodus/prod, property: kc_secret } }
serviceAccount: { annotations: { example.com/role: nodus } }
