api:
  replicas: 3
  autoscaling:
    {
      enabled: true,
      minReplicas: 2,
      maxReplicas: 8,
      targetCPUUtilizationPercentage: 65,
      targetMemoryUtilizationPercentage: 80,
    }
  antiAffinity: hard
worker:
  autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 2, targetCPUUtilizationPercentage: 70 }
  pdb: { enabled: true, minAvailable: 1 }
networkPolicy:
  { enabled: true, restrictEgress: true, egressTo: [{ ipBlock: { cidr: 10.0.0.0/8 } }] }
ingress:
  grpc: { mode: path }
secret:
  existingSecret: nodus-prod
