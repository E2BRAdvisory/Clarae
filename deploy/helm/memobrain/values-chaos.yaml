# Overrides for the disposable chaos cluster (scripts/chaos/run-helm-chaos.sh), applied on top
# of values-k3d.yaml. Chaos-run values only: it does not complete the chart (PDB, HPA,
# anti-affinity, preStop and terminationGracePeriodSeconds belong to M7-WP3).
image:
  repository: memobrain-cloud
  tag: chaos
  pullPolicy: Never

api:
  replicas: 3
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: '1', memory: 512Mi }

config:
  LOG_LEVEL: warn
  # Time the API keeps serving after /readyz turned unavailable on SIGTERM (the in-process
  # replacement of a preStop sleep); the script overrides it with --set for the comparison run.
  SHUTDOWN_DRAIN: 5s
  SHUTDOWN_TIMEOUT: 15s
