{{- $root := . -}}
{{- range $role := list "api" "worker" }}
{{- $spec := index $root.Values $role }}
{{- if $spec.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "memobrain.fullname" $root }}-{{ $role }}
  labels:
    {{- include "memobrain.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  {{- if $spec.pdb.maxUnavailable }}
  maxUnavailable: {{ $spec.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ $spec.pdb.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "memobrain.selector" (dict "root" $root "role" $role) | nindent 6 }}
{{- end }}
{{- end }}
