version: '2'
# One package per module (ADR-0033): internal/db/queries/<module>.sql generates
# internal/<module>/<module>db, which only that module may import (depguard).
# The tables each file may read and write are checked by
# internal/db/ownership_test.go.
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type:
          import: github.com/google/uuid
          type: UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: citext
        go_type: string
      - db_type: timestamptz
        go_type:
          import: time
          type: Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      - db_type: inet
        nullable: true
        go_type:
          import: net/netip
          type: Addr
          pointer: true
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries/admin.sql
    gen:
      go:
        package: admindb
        out: internal/admin/admindb
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: false
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: postgresql
    schema: internal/db/migrations
