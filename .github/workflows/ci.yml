name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflows call this one: nothing is published unless the whole suite passes (ADR-0031).
  workflow_call:

concurrency:
  # github.workflow is the CALLER's name in a reusable call, so a release never shares a group with a branch run.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: auto

jobs:
  go:
    name: Go lint, vuln, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            shared/go/go.sum
            services/cloud/go.sum
            apps/desktop/go.sum
            tools/go.sum
      - name: Linux desktop build deps (WebKitGTK 4.1 for Wails)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install pinned tools
        run: cd tools && GOWORK=off go install tool
      # apps/desktop/main.go embeds the frontend build, which is not in the repository: the Go checks only need the directory.
      - name: Stub the embedded desktop frontend
        run: mkdir -p apps/desktop/frontend/dist && touch apps/desktop/frontend/dist/index.html
      - name: Lint
        run: |
          for m in shared/go services/cloud apps/desktop; do (cd $m && golangci-lint run --build-tags webkit2_41 ./...) || exit 1; done
      - name: Vulnerabilities
        run: for m in shared/go services/cloud apps/desktop; do (cd $m && govulncheck -tags webkit2_41 ./...) || exit 1; done
      - name: Unit tests
        run: |
          (cd shared/go && go test -race -count=1 ./...)
          (cd services/cloud && go test -race -count=1 ./...)
          (cd apps/desktop && go test -race -count=1 -tags webkit2_41 ./internal/...)

  ts:
    name: TypeScript lint, typecheck, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      # The workbench UI is typed against the Wails bindings generated from the Go API (not in the repository).
      - run: make packages/workbench/wailsjs/go/models.ts
      - run: yarn run lint
      - run: yarn typecheck
      - run: yarn run test

  e2e:
    name: 'UI end-to-end (Playwright, desktop UI on mocked bindings, Web UI and workbench on the real core)'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: make packages/workbench/wailsjs/go/models.ts
      # The vault workbench runs the desktop core as WebAssembly in a worker (ADR-0030).
      - run: make wasm-core
      - run: yarn workspace @memobrain/desktop-frontend exec playwright install --with-deps chromium
      - run: yarn workspace @memobrain/desktop-frontend run e2e
      - run: yarn workspace @memobrain/web run e2e
      # The desktop's own user-flow specs, on the workbench in the browser (real core, OPFS, sqlite-wasm).
      - run: yarn workspace @memobrain/web run e2e:workbench-ui

  conformance:
    name: Conformance fixtures (Go + TS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: |
          (cd shared/go && go test -race -count=1 -run Conformance ./conformance/...)
          (cd apps/desktop && go test -race -count=1 -tags webkit2_41 -run Conformance ./internal/parser/...)
          yarn workspace @memobrain/conformance run test
          yarn workspace @memobrain/markdown run test

  cloud-integration:
    name: Cloud integration (testcontainers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - run: cd services/cloud && go test -race -count=1 -tags integration ./test/...

  desktop-sync-e2e:
    name: Desktop sync e2e (two devices)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: cd apps/desktop && go test -race -count=1 -tags "integration webkit2_41" ./internal/sync/...

  wasm-core:
    name: Desktop core as WebAssembly (Go tests under Node + size)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      # The web parity matrix lists every command and binding: it must be regenerated when one is added.
      - run: make packages/workbench/wailsjs/go/models.ts
      - run: node scripts/parity.mjs --check
      # Every package of the desktop core must keep compiling and passing with GOOS=js (sqlite-wasm bridge).
      - run: make test-wasm
      - run: make wasm-core
      - name: The core stays small enough to ship (gzip, limit in web/scripts/esbuild.mjs)
        run: |
          size=$(gzip -9 -c build/wasm/memobrain-core.wasm | wc -c)
          echo "memobrain-core.wasm: $size bytes gzip"
          [ "$size" -le $((8192 * 1024)) ]

  gen-check:
    name: Generated code is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: cd tools && GOWORK=off go install tool
      - run: |
          (cd services/cloud && oapi-codegen -config ../../api/oapi-codegen.yaml ../../api/openapi.yaml && sqlc generate)
          (cd api/proto && buf lint && buf generate)
          yarn workspace @memobrain/api-client run gen
          git diff --exit-code -- services/cloud/internal/api services/cloud/internal/db/dbgen shared/go/notifyv1 packages/api-client/src/gen

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    needs: [go, ts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            tags: '-tags webkit2_41'
          - os: windows-latest
            tags: ''
          - os: macos-latest
            tags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      # setup-node replaces the Node on PATH, so corepack is enabled after it (on Windows the shim is lost otherwise).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
        shell: bash
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # Wails v2.12.0 does not build with Go 1.27 as published: scripts/install-wails.sh links a current x/tools.
      - name: Wails CLI (cached)
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails*
          key: wails-v2.12.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/go.mod', 'scripts/install-wails.sh') }}
      - name: Wails CLI (build)
        if: steps.wails-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/install-wails.sh
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
        shell: bash
      - run: yarn install --immutable
        shell: bash
      - run: cd apps/desktop && wails build -clean ${{ matrix.tags }} -ldflags "-X main.Version=${{ github.sha }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: memobrain-desktop-${{ matrix.os }}
          path: apps/desktop/build/bin/
          retention-days: 7

  cloud-image:
    name: Cloud container image
    needs: [go, cloud-integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (push only on tags, wired in M7)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/cloud/Dockerfile
          push: false
          tags: memobrain-cloud:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
