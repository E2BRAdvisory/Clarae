name: CI

# Pull requests and main (ADR-0031): the verification, the desktop app built on each OS, and the cloud image built
# (not pushed). Releases are published by release.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: auto
  WAILS_VERSION: v2.12.0

jobs:
  desktop:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, tags: '-tags webkit2_41' }
          - { os: windows-2022, tags: '' }
          - { os: macos-14, tags: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: apps/desktop/go.sum
      # setup-node replaces the Node on PATH, so corepack is enabled after it (on Windows the shim is lost otherwise).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
        shell: bash
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # Wails v2.12.0 does not build with Go 1.27 as published: scripts/install-wails.sh links a current x/tools.
      - name: Wails CLI (cached)
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/go.mod', 'scripts/install-wails.sh') }}
      - name: Wails CLI (build)
        if: steps.wails-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/install-wails.sh "$WAILS_VERSION"
      - shell: bash
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: yarn install --immutable
        shell: bash
      - run: cd apps/desktop && wails build -clean ${{ matrix.tags }} -ldflags "-X main.Version=${{ github.sha }}"
        shell: bash

  image:
    name: Cloud image (build only)
    runs-on: ubuntu-24.04
    steps:
      # The two-architecture build does not fit in the ~14 GB the runner leaves free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
