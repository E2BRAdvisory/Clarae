name: CI

# Checks on every commit pushed to any branch (ADR-0031): lint, type checks and unit tests of every module,
# generated code and the web parity matrix up to date. Nothing is built or published here: installers, image
# and chart come from release.yml, only on a tag. Slower suites (Playwright e2e, testcontainers, sync e2e,
# WebAssembly core tests) are run by hand: `task e2e`, `task test-integration`, `task test-wasm`.

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: auto

jobs:
  go:
    name: Go lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            shared/go/go.sum
            services/cloud/go.sum
            apps/desktop/go.sum
            tools/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Linux desktop build deps (WebKitGTK 4.1 for Wails)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install pinned tools
        run: cd tools && GOWORK=off go install tool
      # apps/desktop/main.go embeds the frontend build, which is not in the repository: the Go checks only need the directory.
      - name: Stub the embedded desktop frontend
        run: mkdir -p apps/desktop/frontend/dist && touch apps/desktop/frontend/dist/index.html
      - name: Lint
        run: |
          for m in shared/go services/cloud apps/desktop; do (cd $m && golangci-lint run --build-tags webkit2_41 ./...) || exit 1; done
      - name: Unit tests (including the shared parser conformance fixtures)
        run: |
          (cd shared/go && go test -race -count=1 ./...)
          (cd services/cloud && go test -race -count=1 ./...)
          (cd apps/desktop && go test -race -count=1 -tags webkit2_41 ./internal/...)
      - name: Generated code is up to date
        run: |
          (cd services/cloud && oapi-codegen -config ../../api/oapi-codegen.yaml ../../api/openapi.yaml && sqlc generate)
          (cd api/proto && buf lint && buf generate)
          corepack enable
          yarn install --immutable
          yarn workspace @memobrain/api-client run gen
          git diff --exit-code -- services/cloud/internal/api services/cloud/internal/db/dbgen shared/go/notifyv1 packages/api-client/src/gen

  web:
    name: TypeScript lint, types and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      # The workbench UI is typed against the Wails bindings generated from the Go API (not in the repository).
      - run: cd tools && GOWORK=off go install github.com/go-task/task/v3/cmd/task
      - run: task wailsjs
      # The web parity matrix lists every command and binding: it must be regenerated when one is added.
      - run: node scripts/parity.mjs --check
      - run: yarn run lint
      - run: yarn typecheck
      - run: yarn run test
