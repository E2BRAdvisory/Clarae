name: Release images

# Cloud OCI image (multi-arch) and Helm chart (M7-WP3). NOT executed so far: written and syntax-checked only.
#  - pull request touching the image or the chart: build + helm lint/template, NOTHING is pushed or signed.
#  - tag vX.Y.Z[-pre]: push to GHCR, sign with cosign (keyless OIDC), attach SBOM and provenance,
#    package and push the Helm chart as an OCI artifact and sign it.
#  - workflow_dispatch: same as a pull request (build only).

on:
  pull_request:
    paths:
      - 'services/cloud/**'
      - 'shared/go/**'
      - 'web/**'
      - 'deploy/helm/**'
      - '.github/workflows/release-images.yml'
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Cloud image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR (tags only)
      id-token: write # keyless cosign signature
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/memobrain-cloud" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (tags only)
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.name.outputs.version }}
          # BuildKit attestations: SLSA provenance and an SPDX SBOM stored next to the image in the registry.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, by digest)
        if: github.ref_type == 'tag'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify what was just signed
        if: github.ref_type == 'tag'
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: GitHub provenance attestation (registry)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render every values file
        run: |
          set -euo pipefail
          helm lint deploy/helm/memobrain
          for f in deploy/helm/memobrain/values-k3d.yaml deploy/helm/memobrain/ci/*.yaml; do
            helm lint deploy/helm/memobrain -f "$f"
            helm template ci deploy/helm/memobrain -f "$f" > /dev/null
          done
      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@v3
      - name: Package, push and sign the chart (tags only)
        if: github.ref_type == 'tag'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"; owner="${GITHUB_REPOSITORY_OWNER,,}"
          work="$(mktemp -d)"; cp -R deploy/helm/memobrain "$work/memobrain"
          # The repository default is a placeholder: point it at the image published by this run.
          sed -i "s#ghcr.io/ORG/memobrain-cloud#${REGISTRY}/${owner}/memobrain-cloud#" "$work/memobrain/values.yaml"
          helm package "$work/memobrain" --version "$version" --app-version "$version" -d "$work"
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "${GITHUB_ACTOR}" --password-stdin
          out="$(helm push "$work/memobrain-${version}.tgz" "oci://${REGISTRY}/${owner}/charts" 2>&1 | tee /dev/stderr)"
          digest="$(sed -n 's/^Digest: //p' <<<"$out" | tail -n1)"
          [[ -n "$digest" ]] || { echo "::error::cannot read the pushed chart digest"; exit 1; }
          cosign sign --yes "${REGISTRY}/${owner}/charts/memobrain@${digest}"
