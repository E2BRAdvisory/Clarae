name: Release images

# Cloud OCI image (multi-arch, Web UI and workbench embedded) and Helm chart (M7-WP3, M10, ADR-0031).
#  - pull request touching the image or the chart: build + helm lint/template, NOTHING is pushed or signed.
#  - push to main: push `edge` and `sha-<short>` to GHCR, signed (cosign keyless) with SBOM and provenance.
#  - called by release.yml for a tag (input `version`): push the semver tags (and `latest` for a stable
#    version), sign, and package, push and sign the Helm chart as an OCI artifact.
#  - workflow_dispatch: same as a pull request (build only).
# The image is cross-compiled (Dockerfile): no QEMU emulation, so the two architectures cost about one build.

on:
  pull_request:
    paths:
      - 'services/cloud/**'
      - 'shared/go/**'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'web/**'
      - 'deploy/helm/**'
      - '.github/workflows/release-images.yml'
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: 'Release version (semver, no leading v)'
        required: true
        type: string
    outputs:
      image:
        description: 'Image name without tag'
        value: ${{ jobs.image.outputs.image }}
      digest:
        description: 'Digest of the pushed image index'
        value: ${{ jobs.image.outputs.digest }}
      chart:
        description: 'OCI reference of the pushed Helm chart'
        value: ${{ jobs.chart.outputs.chart }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Cloud image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR (main and releases)
      id-token: write # keyless cosign signature
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      push: ${{ steps.plan.outputs.push }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/memobrain-cloud" >> "$GITHUB_OUTPUT"
          # mode: release (called with a version), edge (push to main), build (pull request, dispatch: nothing leaves the runner)
          if [[ -n "$INPUT_VERSION" ]]; then mode=release; version="$INPUT_VERSION"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then mode=edge; version="0.0.0-edge.${GITHUB_SHA::7}"
          else mode=build; version="0.0.0-dev"; fi
          push=false; [[ "$mode" != build ]] && push=true
          stable=false; [[ "$mode" == release && "$version" != *-* ]] && stable=true
          { echo "mode=$mode"; echo "version=$version"; echo "push=$push"; echo "stable=$stable"; } >> "$GITHUB_OUTPUT"
          echo "Image mode $mode, version $version, push=$push"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.plan.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.plan.outputs.version }},enable=${{ steps.plan.outputs.mode == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.plan.outputs.version }},enable=${{ steps.plan.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.plan.outputs.stable == 'true' }}
            type=raw,value=edge,enable=${{ steps.plan.outputs.mode == 'edge' }}
            type=raw,value=sha-${{ github.sha }},enable=${{ steps.plan.outputs.mode == 'edge' }}
            type=raw,value=pr-build,enable=${{ steps.plan.outputs.mode == 'build' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.plan.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.plan.outputs.version }}
          # BuildKit attestations: SLSA provenance and an SPDX SBOM stored next to the image in the registry.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        if: steps.plan.outputs.push == 'true'
        uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, by digest)
        if: steps.plan.outputs.push == 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify what was just signed
        if: steps.plan.outputs.push == 'true'
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: GitHub provenance attestation (registry)
        if: steps.plan.outputs.push == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.plan.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        run: |
          {
            echo "### Cloud image"
            echo "- image: \`${{ steps.plan.outputs.image }}\` (${{ steps.plan.outputs.mode }})"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- tags: \`$(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' ')\`"
            if [[ "${{ steps.plan.outputs.push }}" == "true" ]]; then
              echo "- a new GHCR package is **private** until it is made public (Package settings > Change visibility): docs/release/README.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      chart: ${{ steps.push.outputs.chart }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render every values file
        run: |
          set -euo pipefail
          helm lint deploy/helm/memobrain
          for f in deploy/helm/memobrain/values-k3d.yaml deploy/helm/memobrain/ci/*.yaml; do
            helm lint deploy/helm/memobrain -f "$f"
            helm template ci deploy/helm/memobrain -f "$f" > /dev/null
          done
      - name: Install cosign
        if: inputs.version != ''
        uses: sigstore/cosign-installer@v3
      - name: Package, push and sign the chart (releases only)
        id: push
        if: inputs.version != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          work="$(mktemp -d)"; cp -R deploy/helm/memobrain "$work/memobrain"
          # The repository default names the project's registry: point it at the image published by this run.
          sed -i "s#ghcr.io/e2br/memobrain-cloud#${REGISTRY}/${owner}/memobrain-cloud#" "$work/memobrain/values.yaml"
          helm package "$work/memobrain" --version "$VERSION" --app-version "$VERSION" -d "$work"
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "${GITHUB_ACTOR}" --password-stdin
          out="$(helm push "$work/memobrain-${VERSION}.tgz" "oci://${REGISTRY}/${owner}/charts" 2>&1 | tee /dev/stderr)"
          digest="$(sed -n 's/^Digest: //p' <<<"$out" | tail -n1)"
          [[ -n "$digest" ]] || { echo "::error::cannot read the pushed chart digest"; exit 1; }
          cosign sign --yes "${REGISTRY}/${owner}/charts/memobrain@${digest}"
          echo "chart=oci://${REGISTRY}/${owner}/charts/memobrain:${VERSION}" >> "$GITHUB_OUTPUT"
