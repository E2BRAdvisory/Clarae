name: Security

# Supply-chain and web-security gates (M7-WP2, docs/security/). ci.yml keeps the
# fast per-PR govulncheck; this workflow adds the dependency audit, SBOMs, the
# license report, secret scanning, the browser-level CSP/SRI checks and the
# consistency checks of the security documents. It also runs weekly, because new
# advisories appear without any change to the repository.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  # Latest patch of the pinned minor: the standard library is part of the attack
  # surface (govulncheck reports it), so scanning must not run on a stale patch.
  GO_VERSION: 1.27.x

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [shared/go, services/cloud, apps/desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: |
            shared/go/go.sum
            services/cloud/go.sum
            apps/desktop/go.sum
      - name: Linux desktop build deps (WebKitGTK 4.1 for Wails)
        if: matrix.module == 'apps/desktop'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # Same version as tools/go.mod (golang.org/x/vuln).
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan (blocking on any vulnerability the code actually calls)
        run: |
          cd ${{ matrix.module }}
          govulncheck -tags webkit2_41 -format text ./...
      - name: JSON report
        if: always()
        run: |
          cd ${{ matrix.module }}
          govulncheck -tags webkit2_41 -format json ./... > "$RUNNER_TEMP/govulncheck.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govulncheck-${{ strategy.job-index }}
          path: ${{ runner.temp }}/govulncheck.json

  yarn-audit:
    name: yarn npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      # Gate: no known high or critical advisory anywhere in the workspaces, dev
      # dependencies included (they run in CI and on developer machines).
      - name: Gate (high and above, blocking)
        run: yarn npm audit --all --recursive --severity high
      # Moderate and low findings, and deprecations, are reported without failing the build:
      # they are triaged weekly (docs/security/pentest-scope.md, "Known accepted findings").
      - name: Full report (non-blocking)
        run: yarn npm audit --all --recursive --severity low | tee "$RUNNER_TEMP/yarn-audit.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yarn-audit
          path: ${{ runner.temp }}/yarn-audit.txt

  sbom:
    name: SBOM and license report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Build the cloud binary with the real Web UI
        run: |
          make web-build
          mkdir -p sbom bin
          (cd services/cloud && CGO_ENABLED=0 go build -trimpath -o ../../bin/memobrain-cloud ./cmd/memobrain-cloud)
      # Syft reads the Go build info of the binary (exact module versions linked in)
      # and yarn.lock for the JavaScript workspaces.
      - name: SBOM of the cloud binary (SPDX)
        uses: anchore/sbom-action@v0
        with:
          file: bin/memobrain-cloud
          format: spdx-json
          output-file: sbom/memobrain-cloud.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of the repository (Go modules and JS workspaces, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom/memobrain-source.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: License report
        run: |
          jq -r '[.components[]? | {name, version, type, licenses: ([.licenses[]? | (.license.id // .license.name // .expression)] | unique)}]
                 | group_by(.licenses | join(" OR ")) | map({license: (.[0].licenses | join(" OR ") | if . == "" then "UNKNOWN" else . end), count: length, examples: ([.[].name] | .[0:5])})
                 | sort_by(-.count)' sbom/memobrain-source.cdx.json > sbom/licenses-summary.json
          cat sbom/licenses-summary.json
          # Strong copyleft in anything shipped to users must be reviewed by hand.
          if jq -e 'map(select(.license | test("(^|[^L])GPL|AGPL|SSPL"; "i"))) | length > 0' sbom/licenses-summary.json >/dev/null; then
            echo "::warning::copyleft licenses found in the SBOM: review sbom/licenses-summary.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    # Optional gate: the first runs on a long history may need an allowlist (.gitleaks.toml).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go install github.com/gitleaks/gitleaks/v8@v8.21.2
      - run: gitleaks detect --source . --redact --no-banner --verbose

  web-security:
    name: CSP and SRI on the production bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: make web-build
      - name: Embedded bundle, headers and CSP (Go)
        run: cd services/cloud && MEMOBRAIN_REQUIRE_WEB_BUILD=1 go test -race -count=1 ./web-embed ./internal/httpserver
      - name: Desktop CSP (release policy)
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          cd apps/desktop && go test -count=1 -tags "production webkit2_41" -run 'TestContentSecurityPolicyInvariants|TestProductionPolicyIsStrict' ./internal/app
      - name: Browser checks (Playwright against the embedded handler)
        run: |
          yarn workspace @memobrain/web exec playwright install --with-deps chromium
          yarn workspace @memobrain/web run e2e:security

  crypto-vectors:
    name: Crypto vectors reproducible and Go/TS in agreement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      # The Go side generates the vectors; regenerating must not change the committed files.
      - name: Regenerate vectors and compare
        run: |
          (cd shared/go && UPDATE_VECTORS=1 go test -count=1 -run 'TestVectors|TestNegativeVectors' ./vaultcrypto/)
          git diff --exit-code -- shared/conformance/crypto
      - run: (cd shared/go && go test -race -count=1 ./vaultcrypto/)
      - run: yarn workspace @memobrain/vaultcrypto-web run test

  docs-consistency:
    name: Security documents are up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - name: Endpoint inventory of docs/security/pentest-scope.md matches api/openapi.yaml
        run: node scripts/pentest-inventory.mjs --check
