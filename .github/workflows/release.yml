name: Release

# On a tag X.Y.Z or X.Y.Z-rc.N or vX.Y.Z or vX.Y.Z-rc.N: cloud image and Helm chart on GHCR, desktop installers for every OS,
# all attached to one GitHub Release. Nothing is signed: the updater is compiled out (ADR-0031).

on:
  push:
    tags:
      [
        '[0-9]+.[0-9]+.[0-9]+',
        '[0-9]+.[0-9]+.[0-9]+-*',
        'v[0-9]+.[0-9]+.[0-9]+',
        'v[0-9]+.[0-9]+.[0-9]+-*',
      ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  WAILS_VERSION: v2.12.0
  NFPM_VERSION: v2.43.0
  APPIMAGETOOL_VERSION: '1.9.0'

jobs:
  image:
    name: Cloud image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # The two-architecture build does not fit in the ~14 GB the runner leaves free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@v4
      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/memobrain-cloud" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # semver patterns skip the minor and latest tags on a prerelease.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"; owner="${GITHUB_REPOSITORY_OWNER,,}"
          work="$(mktemp -d)"; cp -R deploy/helm/memobrain "$work/memobrain"
          # The repository default names the project's registry: point it at the image published by this run.
          sed -i "s#ghcr.io/e2br/memobrain-cloud#ghcr.io/${owner}/memobrain-cloud#" "$work/memobrain/values.yaml"
          helm package "$work/memobrain" --version "$version" --app-version "$version" -d "$work"
          echo "$TOKEN" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          helm push "$work/memobrain-${version}.tgz" "oci://ghcr.io/${owner}/charts"

  desktop:
    name: Desktop ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: macos-universal, os_name: darwin, runner: macos-15, arch: universal }
          - { id: windows-amd64, os_name: windows, runner: windows-2022, arch: amd64 }
          - { id: linux-amd64, os_name: linux, runner: ubuntu-24.04, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      ALLOW_UNSIGNED_UPDATES: '1'
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: apps/desktop/go.sum
      # setup-node replaces the Node on PATH, so corepack is enabled after it (on Windows the shim is lost otherwise).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
        shell: bash
      - run: yarn install --immutable
        shell: bash
      # Wails v2.12.0 does not build with Go 1.27 as published: scripts/install-wails.sh links a current x/tools.
      - name: Wails CLI (cached)
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/go.mod', 'scripts/install-wails.sh') }}
      - name: Wails CLI (build)
        if: steps.wails-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/install-wails.sh "$WAILS_VERSION"
      - shell: bash
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: macOS (.dmg)
        if: matrix.os_name == 'darwin'
        run: |
          bash scripts/release/build-desktop.sh darwin "$VERSION" --release
          bash scripts/release/package-macos.sh "$VERSION"

      - name: Windows (NSIS installer)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          bash scripts/release/build-desktop.sh windows "$VERSION" --release
          mkdir -p dist
          cp "apps/desktop/build/bin/memobrain-$ARCH-installer.exe" "dist/memobrain-$VERSION-windows-$ARCH.exe"

      - name: Linux (.deb, AppImage)
        if: matrix.os_name == 'linux'
        env:
          # appimagetool is itself an AppImage: run it extracted, so the runner needs no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}
          sudo curl -fsSL -o /usr/local/bin/appimagetool "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          sudo chmod +x /usr/local/bin/appimagetool
          bash scripts/release/build-desktop.sh linux "$VERSION" --release
          bash scripts/release/package-linux.sh all "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.id }}
          path: dist/memobrain-*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [image, chart, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"; owner="${GITHUB_REPOSITORY_OWNER,,}"
          (cd dist && sha256sum memobrain-* > SHA256SUMS)
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          bash scripts/release/notes.sh "$version" "$prev" > notes.md
          {
            echo; echo "## Cloud service"
            echo; echo '```sh'
            echo "docker pull ghcr.io/${owner}/memobrain-cloud:${version}"
            echo "helm install memobrain oci://ghcr.io/${owner}/charts/memobrain --version ${version}"
            echo '```'
            echo; echo "The desktop installers are not code-signed: macOS Gatekeeper and Windows SmartScreen warn on first launch. Verify the download against \`SHA256SUMS\`."
          } >> notes.md
          flags=(--title "MemoBrain Notes ${version}" --notes-file notes.md)
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/memobrain-* dist/SHA256SUMS
