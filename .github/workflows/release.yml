name: Release

# On a tag X.Y.Z or X.Y.Z-rc.N or vX.Y.Z or vX.Y.Z-rc.N: cloud image and Helm chart on GHCR, desktop installers for every OS,
# all attached to one GitHub Release. Nothing is signed: the updater is compiled out (ADR-0031).
#
# Supply chain: every action is pinned to a full commit SHA (the comment names its release), every
# downloaded binary is checked against scripts/release/checksums.sha256, Go tools come from go.sum-verified
# modules. Refreshing the pins: deploy/PINS.md.

on:
  push:
    tags:
      [
        '[0-9]+.[0-9]+.[0-9]+',
        '[0-9]+.[0-9]+.[0-9]+-*',
        'v[0-9]+.[0-9]+.[0-9]+',
        'v[0-9]+.[0-9]+.[0-9]+-*',
      ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  NFPM_VERSION: v2.43.0
  HELM_VERSION: v4.3.1
  # Both files are verified against scripts/release/checksums.sha256 (bump version and checksum together).
  APPIMAGETOOL_VERSION: '1.9.0'
  APPIMAGE_RUNTIME_VERSION: '20251108'

jobs:
  image:
    name: Cloud image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # The two-architecture build does not fit in the ~14 GB the runner leaves free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/clarae-cloud" >> "$GITHUB_ENV"
          # 1.5 only: the same image under the name of 1.x, so that the Compose files and Helm values of an
          # installation made for 1.x (repository ghcr.io/<owner>/memobrain-cloud) pull the upgrade without edits
          # (ADR-0052). Dropped in 1.6: remove this line, the second `images:` entry below and its allowlist line.
          echo "IMAGE_LEGACY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/memobrain-cloud" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_LEGACY }}
          # semver patterns skip the minor and latest tags on a prerelease.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Package and push the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"; owner="${GITHUB_REPOSITORY_OWNER,,}"
          work="$(mktemp -d)"; cp -R deploy/helm/clarae "$work/clarae"
          # The repository default names the project's registry: point it at the image published by this run.
          # Only the chart's own default (clarae-cloud) is rewritten: the name of 1.x lives in the values of the
          # installations that upgrade, not in the chart, and is published next to it by the image job (1.5 only).
          sed -i "s#ghcr.io/e2br/clarae-cloud#ghcr.io/${owner}/clarae-cloud#" "$work/clarae/values.yaml"
          helm package "$work/clarae" --version "$version" --app-version "$version" -d "$work"
          echo "$TOKEN" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          helm push "$work/clarae-${version}.tgz" "oci://ghcr.io/${owner}/charts"

  desktop:
    name: Desktop ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: macos-universal, os_name: darwin, runner: macos-15, arch: universal }
          - { id: windows-amd64, os_name: windows, runner: windows-2022, arch: amd64 }
          - { id: linux-amd64, os_name: linux, runner: ubuntu-24.04, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      ALLOW_UNSIGNED_UPDATES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: apps/desktop/go.sum
      # setup-node replaces the Node on PATH, so corepack is enabled after it (on Windows the shim is lost otherwise).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
        shell: bash
      - run: yarn install --immutable
        shell: bash
      # The binary is built with plain `go build` (scripts/build-desktop-bin.sh, ADR-0051); the wails3 CLI is needed only
      # on Windows (`wails3 generate syso` for the exe resources, `wails3 generate webview2bootstrapper` for the
      # installer). Its version is the Wails library version in apps/desktop/go.mod (scripts/install-wails.sh reads it):
      # the cache key follows that file, so a library bump rebuilds the CLI.
      - name: Wails pins (go.mod, npm runtime)
        shell: bash
        run: bash scripts/install-wails.sh --check-pins
      - name: Wails CLI (cached)
        if: matrix.os_name == 'windows'
        id: wails-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/wails3*
          key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/go.mod', 'go.work', 'tools/go.mod', 'scripts/install-wails.sh') }}
      - name: Wails CLI (build)
        if: matrix.os_name == 'windows' && steps.wails-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/install-wails.sh
      - name: Wails CLI (version check)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          PATH="$HOME/go/bin:$PATH" bash scripts/install-wails.sh --check

      - name: macOS (.dmg)
        if: matrix.os_name == 'darwin'
        run: |
          bash scripts/release/build-desktop.sh darwin "$VERSION" --release
          bash scripts/release/package-macos.sh "$VERSION"

      - name: Windows (NSIS installer)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          bash scripts/release/build-desktop.sh windows "$VERSION" --release
          mkdir -p dist
          cp "apps/desktop/build/bin/clarae-$ARCH-installer.exe" "dist/clarae-$VERSION-windows-$ARCH.exe"

      - name: Linux (.deb, AppImage)
        if: matrix.os_name == 'linux'
        env:
          # appimagetool is itself an AppImage: run it extracted, so the runner needs no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          # GTK3 + WebKit2GTK 4.1: the build script passes -tags production,gtk3 and checks what the binary links.
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}
          pins="$RUNNER_TEMP/appimage"; mkdir -p "$pins"
          curl -fsSL --retry 3 -o "$pins/appimagetool-${APPIMAGETOOL_VERSION}-x86_64.AppImage" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          curl -fsSL --retry 3 -o "$pins/runtime-${APPIMAGE_RUNTIME_VERSION}-x86_64" \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64"
          # Both files must have a checksum line: a version bumped without its checksum fails here.
          grep -e "  appimagetool-${APPIMAGETOOL_VERSION}-x86_64.AppImage\$" -e "  runtime-${APPIMAGE_RUNTIME_VERSION}-x86_64\$" \
            scripts/release/checksums.sha256 > "$pins/SHA256SUMS"
          test "$(wc -l < "$pins/SHA256SUMS")" -eq 2
          (cd "$pins" && sha256sum -c SHA256SUMS)
          sudo install -m 0755 "$pins/appimagetool-${APPIMAGETOOL_VERSION}-x86_64.AppImage" /usr/local/bin/appimagetool
          export APPIMAGE_RUNTIME_FILE="$pins/runtime-${APPIMAGE_RUNTIME_VERSION}-x86_64"
          bash scripts/release/build-desktop.sh linux "$VERSION" --release
          bash scripts/release/package-linux.sh all "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.id }}
          path: dist/clarae-*
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [image, chart, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"; owner="${GITHUB_REPOSITORY_OWNER,,}"
          (cd dist && sha256sum clarae-* > SHA256SUMS)
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          bash scripts/release/notes.sh "$version" "$prev" > notes.md
          {
            echo; echo "## Cloud service"
            echo; echo '```sh'
            echo "docker pull ghcr.io/${owner}/clarae-cloud:${version}"
            echo "helm install clarae oci://ghcr.io/${owner}/charts/clarae --version ${version} -f my-values.yaml"
            echo '```'
            echo; echo "The desktop installers are not code-signed: macOS Gatekeeper and Windows SmartScreen warn on first launch. Verify the download against \`SHA256SUMS\`."
          } >> notes.md
          flags=(--title "Clarae notanda ${version}" --notes-file notes.md)
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/clarae-* dist/SHA256SUMS
