name: Release

# One pipeline per release (M7-WP3, M10, ADR-0023, ADR-0031). On a tag vX.Y.Z or vX.Y.Z-rc.N:
#   meta -> ci (the whole suite, as a gate) -> images (GHCR, signed, + Helm chart) and desktop installers
#   (macOS universal, Windows amd64 + arm64, Linux amd64 [+ arm64]) -> ONE GitHub Release.
# Signing is optional: without the certificates the installers are built UNSIGNED and the release is marked
# a prerelease saying so; set the repository variable REQUIRE_SIGNING=true to make missing secrets fatal.
#  - workflow_dispatch: dry run. Same builds, no images, no release; the output is the workflow artifacts.
# Secrets and variables: docs/release/secrets.md. Nothing is published on pull requests.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (semver, no leading v), e.g. 1.0.0-rc.1'
        required: true
        default: '0.0.0-dryrun.1'
      use_secrets:
        description: 'Sign with the real secrets (still no release is created)'
        type: boolean
        default: false
      run_ci:
        description: 'Run the whole CI suite first (always on for a tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: auto
  WAILS_VERSION: v2.12.0
  NFPM_VERSION: v2.43.0
  APPIMAGETOOL_VERSION: '1.9.0'

jobs:
  meta:
    name: Resolve version and signing
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      is_tag: ${{ steps.v.outputs.is_tag }}
      apple: ${{ steps.v.outputs.apple }}
      windows: ${{ steps.v.outputs.windows }}
      updates: ${{ steps.v.outputs.updates }}
      unsigned: ${{ steps.v.outputs.unsigned }}
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          USE_SECRETS: ${{ inputs.use_secrets }}
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING }}
          LINUX_ARM64_RUNNER: ${{ vars.LINUX_ARM64_RUNNER }}
          # Only their presence is tested here; the build jobs read them.
          HAS_APPLE: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_WINDOWS: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
          HAS_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' && vars.UPDATE_PUBLIC_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"; is_tag=true; use=true
          else
            version="$INPUT_VERSION"; is_tag=false; use="${USE_SECRETS:-false}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid semver '$version'"; exit 1; }
          channel=stable; [[ "$version" == *-* ]] && channel=beta

          # A signing step runs only when it is wanted (a tag, or a dry run asking for the secrets) AND the secrets exist.
          flag() { [[ "$use" == true && "$1" == true ]] && echo true || echo false; }
          apple="$(flag "$HAS_APPLE")"; windows="$(flag "$HAS_WINDOWS")"; updates="$(flag "$HAS_UPDATE_KEY")"
          unsigned=false; [[ "$apple" != true || "$windows" != true ]] && unsigned=true

          if [[ "$is_tag" == true && "$REQUIRE_SIGNING" == true ]]; then
            missing=()
            [[ "$apple" == true ]] || missing+=("Apple signing (APPLE_CERT_P12_BASE64, APPLE_SIGNING_IDENTITY)")
            [[ "$windows" == true ]] || missing+=("Authenticode (WINDOWS_CERT_PFX_BASE64)")
            [[ "$updates" == true ]] || missing+=("update manifest (UPDATE_SIGNING_KEY, variable UPDATE_PUBLIC_KEY)")
            if (( ${#missing[@]} )); then
              echo "::error::REQUIRE_SIGNING is true and these are missing: ${missing[*]}"; exit 1
            fi
          fi

          # The desktop matrix. Linux arm64 needs an arm64 runner (WebKitGTK is CGO): name it in LINUX_ARM64_RUNNER
          # (ubuntu-24.04-arm is free for public repositories); without it the release has no arm64 Linux build.
          matrix='[
            {"id":"macos-universal","os_name":"darwin","runner":"macos-14","arch":"universal"},
            {"id":"windows-amd64","os_name":"windows","runner":"windows-2022","arch":"amd64"},
            {"id":"windows-arm64","os_name":"windows","runner":"windows-2022","arch":"arm64"},
            {"id":"linux-amd64","os_name":"linux","runner":"ubuntu-24.04","arch":"amd64"}]'
          if [[ -n "$LINUX_ARM64_RUNNER" ]]; then
            matrix="$(jq -c --arg r "$LINUX_ARM64_RUNNER" '. + [{"id":"linux-arm64","os_name":"linux","runner":$r,"arch":"arm64"}]' <<<"$matrix")"
          else
            matrix="$(jq -c . <<<"$matrix")"
            echo "::notice::LINUX_ARM64_RUNNER is not set: no Linux arm64 installer in this run"
          fi

          { echo "version=$version"; echo "channel=$channel"; echo "is_tag=$is_tag"
            echo "apple=$apple"; echo "windows=$windows"; echo "updates=$updates"; echo "unsigned=$unsigned"
            echo "matrix=$matrix"; } >> "$GITHUB_OUTPUT"
          {
            echo "### Release $version ($channel, tag=$is_tag)"
            echo "| signing | active |"; echo "|---|---|"
            echo "| macOS (Developer ID + notarisation) | $apple |"; echo "| Windows (Authenticode) | $windows |"
            echo "| update manifest (ed25519) | $updates |"
            [[ "$unsigned" == true ]] && echo $'\n:warning: installers will be **unsigned**: Gatekeeper / SmartScreen will warn (docs/release/secrets.md).'
          } >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI gate
    needs: meta
    if: needs.meta.outputs.is_tag == 'true' || inputs.run_ci
    uses: ./.github/workflows/ci.yml

  images:
    name: Cloud image and chart
    needs: [meta, ci]
    # Only a real release pushes: a dry run builds the installers and nothing else leaves the runner.
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.ci.result != 'failure' && needs.ci.result != 'cancelled' && needs.meta.outputs.is_tag == 'true' }}
    uses: ./.github/workflows/release-images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      version: ${{ needs.meta.outputs.version }}

  build:
    name: Build ${{ matrix.id }}
    needs: [meta, ci]
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.ci.result != 'failure' && needs.ci.result != 'cancelled' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.meta.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCH: ${{ matrix.arch }}
      # Compiled into the binary (scripts/release/build-desktop.sh). Public by nature, so repository variables.
      UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
      UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
      # Without the update key the updater is compiled out (ADR-0031): a build never trusts the development key.
      ALLOW_UNSIGNED_UPDATES: ${{ needs.meta.outputs.updates == 'true' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      # Wails v2.12.0 does not build with Go 1.27 as published: scripts/install-wails.sh links a current x/tools.
      - name: Wails CLI (cached)
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails*
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/go.mod', 'scripts/install-wails.sh') }}
      - name: Wails CLI (build)
        if: steps.wails-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/install-wails.sh "$WAILS_VERSION"
      - shell: bash
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Release mode (a tag must carry the real update key, or be explicitly unsigned)
        shell: bash
        run: |
          if [[ "${{ needs.meta.outputs.is_tag }}" == "true" ]]; then echo "RELEASE_FLAG=--release" >> "$GITHUB_ENV"; else echo "RELEASE_FLAG=" >> "$GITHUB_ENV"; fi

      # ---------------------------------------------------------------- macOS
      - name: macOS build
        if: matrix.os_name == 'darwin'
        run: bash scripts/release/build-desktop.sh darwin "$VERSION" "$RELEASE_FLAG"
      - name: macOS signing material
        if: matrix.os_name == 'darwin' && needs.meta.outputs.apple == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY_S: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/build.keychain-db"; pw="$(openssl rand -base64 24)"
          security create-keychain -p "$pw" "$kc"; security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_S" >> "$GITHUB_ENV"
          if [[ -n "$APPLE_API_KEY_P8_BASE64" ]]; then
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}"
              echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}"
            } >> "$GITHUB_ENV"
          fi
      - name: macOS dmg (sign, notarise, staple when the secrets exist)
        if: matrix.os_name == 'darwin'
        run: |
          if [[ "${{ needs.meta.outputs.apple }}" == "true" ]]; then flag=--require-signing; else flag=""; echo "::warning::macOS dmg is UNSIGNED"; fi
          bash scripts/release/package-macos.sh "$VERSION" $flag

      # -------------------------------------------------------------- Windows
      - name: Windows signing command
        if: matrix.os_name == 'windows' && needs.meta.outputs.windows == 'true'
        shell: bash
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$WINDOWS_CERT_PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/codesign.pfx"
          signtool="$(find "/c/Program Files (x86)/Windows Kits/10/bin" -name signtool.exe -path '*x64*' | sort | tail -n1)"
          # build-desktop.sh signs memobrain.exe with this command, then NSIS signs the installer and uninstaller.
          echo "MEMOBRAIN_SIGNTOOL_CMD=\"$signtool\" sign /fd SHA256 /td SHA256 /tr ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }} /f $RUNNER_TEMP/codesign.pfx /p $WINDOWS_CERT_PASSWORD \"%1\"" >> "$GITHUB_ENV"
      - name: Windows build (NSIS installer)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          [[ "${{ needs.meta.outputs.windows }}" == "true" ]] || echo "::warning::Windows installer is UNSIGNED"
          bash scripts/release/build-desktop.sh windows "$VERSION" "$RELEASE_FLAG"
          mkdir -p dist
          cp "apps/desktop/build/bin/memobrain-$ARCH-installer.exe" "dist/memobrain-$VERSION-windows-$ARCH.exe"
      - name: Windows verify signature
        if: matrix.os_name == 'windows' && needs.meta.outputs.windows == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("dist/memobrain-$env:VERSION-windows-$env:ARCH.exe", "apps/desktop/build/bin/memobrain.exe")) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "$f signature status: $($sig.Status)" }
          }

      # ---------------------------------------------------------------- Linux
      - name: Linux build and packages (.deb, AppImage)
        if: matrix.os_name == 'linux'
        env:
          # appimagetool is itself an AppImage: run it extracted, so the runner needs no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}
          case "$ARCH" in amd64) ai=x86_64 ;; arm64) ai=aarch64 ;; esac
          sudo curl -fsSL -o /usr/local/bin/appimagetool "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${ai}.AppImage"
          sudo chmod +x /usr/local/bin/appimagetool
          export PATH="$PATH:$HOME/go/bin"
          bash scripts/release/build-desktop.sh linux "$VERSION" "$RELEASE_FLAG"
          bash scripts/release/package-linux.sh all "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.id }}
          path: dist/memobrain-*
          if-no-files-found: error

  release:
    name: Checksums, update manifest, GitHub Release
    needs: [meta, images, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release
      id-token: write # build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
      UNSIGNED: ${{ needs.meta.outputs.unsigned }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum memobrain-* > SHA256SUMS && cat SHA256SUMS

      - name: Release notes
        env:
          IMAGE: ${{ needs.images.outputs.image }}
          DIGEST: ${{ needs.images.outputs.digest }}
          CHART: ${{ needs.images.outputs.chart }}
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          bash scripts/release/notes.sh "$VERSION" "$prev" > dist/RELEASE_NOTES.md
          {
            if [[ -n "$IMAGE" ]]; then
              echo; echo "## Cloud service"
              echo; echo '```sh'
              echo "docker pull ${IMAGE}:${VERSION}"
              echo "# pinned: ${IMAGE}@${DIGEST}"
              echo '```'
              echo; echo "Helm chart: \`${CHART}\`. Images are signed with cosign (keyless); the GHCR package must be public to pull it anonymously."
            fi
            if [[ "$UNSIGNED" == true ]]; then
              echo; echo "## Unsigned installers"
              echo; echo "These installers are **not code-signed** yet: macOS Gatekeeper and Windows SmartScreen warn on first launch (right-click > Open on macOS, *More info > Run anyway* on Windows). Verify the download against \`SHA256SUMS\`."
            fi
          } >> dist/RELEASE_NOTES.md

      - name: Update manifest (only with the update signing key; sequence = workflow run number)
        if: needs.meta.outputs.updates == 'true'
        env:
          MEMOBRAIN_UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          (cd tools/release && GOWORK=off go build -o ../../dist/release-tool .)
          # Release workflow runs are monotonic, so the run number is a valid manifest sequence.
          # Rule: never re-run an old tag after a newer one was published (docs/release/README.md).
          dist/release-tool gen-manifest -channel "$CHANNEL" -version "$VERSION" -sequence "$GITHUB_RUN_NUMBER" \
            -notes-file dist/RELEASE_NOTES.md -artifacts-dir dist -base-url "$base" -out dist/manifest.json
          dist/release-tool sign-manifest -in dist/manifest.json
          dist/release-tool verify-manifest -in dist/manifest.json -pubkey "$UPDATE_PUBLIC_KEY"
          rm dist/release-tool
      - name: No update manifest
        if: needs.meta.outputs.updates != 'true'
        run: echo "::notice::No update signing key, so the desktop builds have the updater compiled out and no manifest is published."

      - name: SBOM (source tree)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/memobrain-${{ needs.meta.outputs.version }}-sbom.spdx.json
          upload-artifact: false

      - name: Provenance attestation of the release files
        if: needs.meta.outputs.is_tag == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/memobrain-*
            dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

      - name: GitHub Release (tags only)
        if: needs.meta.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_PUBLISH: ${{ vars.RELEASE_AUTO_PUBLISH }}
        run: |
          set -euo pipefail
          flags=(--title "MemoBrain Notes ${VERSION}" --notes-file dist/RELEASE_NOTES.md)
          # A human promotes the draft after the cross-OS checklist, unless RELEASE_AUTO_PUBLISH=true.
          [[ "$AUTO_PUBLISH" == true ]] || flags+=(--draft)
          # Unsigned installers are never presented as the latest stable release.
          if [[ "$VERSION" == *-* || "$UNSIGNED" == true ]]; then flags+=(--prerelease); fi
          files=(dist/memobrain-* dist/SHA256SUMS)
          # The manifest is attached but only becomes the live update channel when copied to UPDATE_BASE_URL.
          [[ -f dist/manifest.json ]] && files+=(dist/manifest.json dist/manifest.json.sig)
          gh release create "v${VERSION}" "${flags[@]}" "${files[@]}"
