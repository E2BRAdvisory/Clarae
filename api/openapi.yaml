openapi: 3.1.0
info:
  title: Clarae notanda Cloud API
  version: 1.5.1
  description: |
    REST contract of the Clarae notanda Cloud Service (Specifications.md §3.1, §3.5).
    This file is the single source of truth: the Go server stubs (strict server and
    request validator), the Go client (`shared/go/apiclient`) and the TypeScript client
    (`@clarae/api-client`) are generated from it (`task gen-openapi`).

    **Version.** `info.version` is the product version (git tag `vX.Y.Z`) of the
    release that ships this contract. The URL prefix `/api/v1` only changes with an
    incompatible revision.

    **Conventions.** JSON UTF-8, RFC 3339 UTC timestamps, sizes in bytes, UUID v7
    identifiers, errors as `application/problem+json` (RFC 9457) with an application
    `code` (enum `ErrorCode`). Every operation may also answer `default`
    (code `INTERNAL`, HTTP 500) on an unexpected failure.

    **Pagination.** Lists that can grow without bound are keyset paginated: `limit`
    (the page size; default and maximum in each operation, 100 and 500 unless stated)
    and `cursor`, the opaque `next_cursor` of the previous page. The answer is
    `{items, next_cursor}`. Without `limit` and `cursor` an operation answers its first
    page with the default size, so a client that sends neither still gets a bounded
    answer and the cursor of what follows. `next_cursor` is absent on the last page and
    only its absence ends the list: a page may hold fewer than `limit` items, even none,
    when the server leaves out rows the caller must not see. Every page is authorized
    on its own. A cursor is a position, not a snapshot: an item created, renamed or
    removed between two pages may be missed or appear twice, so clients deduplicate by
    id. A cursor is valid only for the operation (and path) that returned it; a cursor
    the server cannot read is `400 VALIDATION_FAILED`. `GET /admin/users` pages by
    `offset` instead.

    **Authentication and roles.** Operations take a Keycloak access token as a bearer
    token (`bearerAuth`; the cloud is an OIDC resource server and validates `iss`,
    `aud=clarae-api` and the signature against the realm's JWKS). The
    `openIdConnect` scheme `oidc` only documents where clients obtain such a token;
    the issuer of a running instance is returned by `GET /client-config`. Authentication
    runs before every authenticated operation (and the routes outside this contract) and
    can refuse the request on its own, whatever the operation declares for its business
    errors: a missing or invalid token is `401 UNAUTHENTICATED`; a suspended or deleted
    account is `403 USER_SUSPENDED` (response `Forbidden`); an identity that cannot be
    linked to an account, because another account already uses its e-mail address, is
    `409 INVALID_STATE` (response `IdentityConflict`, ADR-0041) until an administrator
    resolves it; an exhausted per-user bucket is `429 RATE_LIMITED`. Every authenticated
    operation therefore declares 401, 403, 409 and 429. Operations
    marked `x-required-role: clarae-admin` (the `admin` tag) also require that
    Keycloak realm role in the token (`realm_access.roles`); without it they answer
    `403 FORBIDDEN`. Groups never come from the token (D-05).

    **Limits.** Every route, including those outside this contract, is rate limited
    per client address (token bucket; the address is resolved through
    `TRUSTED_PROXIES`) and, once the token is accepted, per user with a second, smaller
    bucket: responses carry `RateLimit-Limit` and `RateLimit-Remaining`,
    and an exhausted bucket answers `429 RATE_LIMITED` with `Retry-After` (seconds).
    Health probes from direct internal callers are exempt. JSON operations have a
    60 s deadline and a request body of at most 8 MiB (`413 FILE_TOO_LARGE`); the
    operations that stream bytes (blobs, ZIP exports, personal data export) have no
    deadline and their own size limits.

    **Routes outside this contract** (ADR-0037 §3): resumable uploads (tus 1.0.0) and
    the Server-Sent Events stream (`GET /events`) speak their own protocol, so no stub
    or client is generated for them. They are documented in the root extension
    `x-clarae-external-routes`.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
    description: Health, readiness and public client bootstrap (no authentication)
  - name: me
    description: Profile, devices, usage, effective configuration and personal data of the authenticated user
  - name: vaults
    description: Vault lifecycle, tree and encryption key envelopes
  - name: sync
    description: Changelog, blob transfer and commit (§3.4)
  - name: history
    description: File revisions and restore
  - name: directory
    description: Users and groups the caller can share with (groups exist only in the cloud database, D-05)
  - name: sharing
    description: Shares of folders or whole shared vaults, grants and invitations (§3.4.7); not allowed on private vaults
  - name: export
    description: ZIP export of a vault, streamed or as a background job
  - name: admin
    description: >-
      Administration console: users, groups, Config Profiles, storage settings and audit log.
      Every operation requires the `clarae-admin` realm role (`x-required-role`)

x-clarae-external-routes:
  description: >-
    Routes served under the same base path, with the same bearer authentication and the same
    per-client rate limit, but outside the generated contract (ADR-0037 §3). The request
    validator, the 60 s deadline and the 8 MiB JSON body limit do not apply to them. Errors are
    `application/problem+json` with the codes of `ErrorCode`. Besides the answers listed for each
    route, authentication can refuse any of them as it does for the operations of the contract:
    401 UNAUTHENTICATED, 403 USER_SUSPENDED, 409 INVALID_STATE (identity conflict, ADR-0041) and
    429 RATE_LIMITED. Server:
    services/cloud/internal/blobs/tus.go and services/cloud/internal/notify/sse.go; client:
    apps/desktop/internal/sync/transport (tus.go, notify.go).
  tus:
    protocol: tus 1.0.0 (extensions creation, termination)
    description: >-
      Resumable upload of a blob larger than a single `PUT /vaults/{vaultId}/blobs/{sha256}`
      accepts (32 MB). Chunks are stored as separate objects, so an upload survives a restart and
      works across replicas. When the last byte arrives the server assembles the chunks, checks
      the SHA-256 announced at creation and publishes the blob; the client then references it in
      `commit` like any other blob. An upload expires after `uploads.expiry_hours` (default 24 h)
      and is visible only to the user who created it (anyone else gets 404). Its announced length
      counts against the vault owner's quota from creation, like the bytes of uploaded blobs not
      committed yet (see `putBlob`). If the finalization after the last chunk is interrupted, a
      HEAD (or an empty PATCH at the final offset) completes it before answering. Every request except
      OPTIONS must send `Tus-Resumable: 1.0.0` (otherwise 400 VALIDATION_FAILED); every response
      carries `Tus-Resumable: 1.0.0` and `Cache-Control: no-store`.
    routes:
      - method: OPTIONS
        path: /vaults/{vaultId}/uploads
        summary: Capabilities of the server
        responses:
          '204': 'Tus-Version: 1.0.0, Tus-Extension: creation,termination, Tus-Max-Size (files.max_size_bytes)'
      - method: POST
        path: /vaults/{vaultId}/uploads
        summary: Create an upload (needs the editor level on the vault)
        query:
          scope: share scope, as for the other vault operations
        requestHeaders:
          Upload-Length: total size in bytes (required, positive, at most files.max_size_bytes)
          Upload-Metadata: '`sha256 <base64 of the hex digest>` (required)'
        responses:
          '201': '`Location: /api/v1/uploads/{uploadId}`'
          '400': VALIDATION_FAILED (missing or invalid Upload-Length or sha256 metadata)
          '403': FORBIDDEN (not an editor of the vault)
          '404': NOT_FOUND (vault)
          '413': >-
            FILE_TOO_LARGE (Upload-Length above the limit) or QUOTA_EXCEEDED (it does not fit in the
            owner's quota next to the used bytes and the bytes uploaded but not committed yet)
      - method: OPTIONS
        path: /uploads/{uploadId}
        summary: Capabilities of the server (same answer as above)
      - method: HEAD
        path: /uploads/{uploadId}
        summary: Current offset, to resume
        responses:
          '200': >-
            Upload-Offset and Upload-Length; when every byte has arrived, the blob is published
            first (a finalization that did not complete is retried)
          '400': VALIDATION_FAILED (the retried finalization found a corrupted upload, now discarded)
          '404': NOT_FOUND (unknown, expired or someone else's upload)
      - method: PATCH
        path: /uploads/{uploadId}
        summary: Append a chunk at the current offset
        requestHeaders:
          Content-Type: application/offset+octet-stream
          Upload-Offset: offset the chunk starts at; must equal the server offset
          Content-Length: 1 to 64 MiB (0 at the final offset retries the finalization)
        responses:
          '204': new Upload-Offset; after the last chunk the blob is verified and published
          '400': >-
            VALIDATION_FAILED: wrong Content-Type or Content-Length, chunk beyond Upload-Length,
            digest mismatch on the last chunk (the upload is discarded), or an offset mismatch
            (the answer carries the server offset in the Upload-Offset header and in the
            problem's `offset` member)
          '404': NOT_FOUND
      - method: DELETE
        path: /uploads/{uploadId}
        summary: Abandon an upload and drop its chunks (termination extension)
        responses:
          '204': upload removed
          '404': NOT_FOUND
  events:
    protocol: Server-Sent Events (text/event-stream)
    description: >-
      Notification stream for networks that block the gRPC NotifyService (§3.5.3), with the same
      events. On connect the server sends a `: connected` comment, then replays what the client
      missed according to the query parameters, then live events. A `: ping` comment every 25 s
      keeps proxies from closing an idle stream. The stream ends when the access token expires,
      after a `token-expired` event: the client renews the token and reconnects. It also ends right
      after an `account_changed` with kind `suspended`. When the request
      ends for another reason (client gone, server draining) the stream simply closes and the
      client reconnects. Response headers: `Cache-Control: no-store`, `X-Accel-Buffering: no`.
    routes:
      - method: GET
        path: /events
        summary: Open the notification stream of the authenticated user
        query:
          known: >-
            replay positions as `vault_id:seq` pairs separated by commas; a `vault_changed` is
            replayed for every visible vault whose last seq is higher
          config: Config Profile revision the client holds; a newer one is replayed as `config_changed`
        responses:
          '200': text/event-stream
          '401': UNAUTHENTICATED
          '403': USER_SUSPENDED (the account is suspended or deleted; do not reconnect)
          '409': >-
            INVALID_STATE: the identity of the token conflicts with an existing account (ADR-0041);
            reconnecting does not help until an administrator resolves it
          '429': >-
            RATE_LIMITED: the client address or the user exhausted its bucket, or the user already
            holds the maximum number of streams on this replica (32); reconnect after `Retry-After`
            when present, otherwise with the usual backoff
    eventTypes:
      vault_changed: '`{"vault_id": "<uuid>", "seq": <int>}`: new commits up to seq (pull `changes?since`)'
      config_changed: '`{"version": <int>}`: the effective configuration changed (`GET /config/effective`)'
      share_changed: '`{"share_id": "<uuid>", "kind": "granted|updated|revoked"}`: a share or invitation that concerns the user changed'
      account_changed: >-
        `{"kind": "suspended|activated|quota_changed"}`: the account changed; after `suspended` (also sent
        when the account is deleted) the stream ends and a reconnect is refused
      token-expired: '`{}`: the access token expired; the stream closes right after'
      heartbeat: 'the comment line `: ping`, every 25 s (not an event: no `event:` field)'

paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
  /readyz:
    get:
      tags: [system]
      operationId: readyz
      summary: Readiness probe (database, object storage, identity provider reachable)
      security: []
      responses:
        '200':
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/InternalError'

  /client-config:
    get:
      tags: [system]
      operationId: getClientConfig
      summary: Public bootstrap information for clients (OIDC issuer and client id, notify endpoint)
      description: Lets a desktop client start a login knowing only the server URL (ADR-0008).
      security: []
      responses:
        '200':
          description: Client configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      tags: [me]
      operationId: getMe
      security:
        - bearerAuth: []
      summary: Profile, role, effective quota, usage and config version
      description: Provisions the user just-in-time on first login (§1.3).
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [me]
      operationId: deleteMyAccount
      security:
        - bearerAuth: []
      summary: Delete the caller's account (GDPR art. 17)
      description: >
        Irreversible. `confirm` must equal the caller's username. When the caller owns private
        (end-to-end encrypted) vaults, `acknowledge_data_loss` must be true: their content cannot be
        recovered by anyone. The account is anonymised at once, vaults enter the retention period and are
        then purged by the worker. The last active administrator cannot delete the account (code INVALID_STATE).
        Not part of Specifications.md §3.5 (ADR-0021).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '204':
          description: Account deleted
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /me/devices:
    get:
      tags: [me]
      operationId: listMyDevices
      security:
        - bearerAuth: []
      summary: Registered devices of the current user
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      tags: [me]
      operationId: registerDevice
      security:
        - bearerAuth: []
      summary: Register this device and obtain its device_id
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /me/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    delete:
      tags: [me]
      operationId: revokeDevice
      security:
        - bearerAuth: []
      summary: Revoke a device
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /config/effective:
    get:
      tags: [me]
      operationId: getEffectiveConfig
      security:
        - bearerAuth: []
      summary: Effective configuration for the current user (product defaults → global → groups → user)
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Effective configuration
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveConfig'
        '304':
          description: Not modified
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /me/usage:
    get:
      tags: [me]
      operationId: getMyUsage
      security:
        - bearerAuth: []
      summary: Storage usage against the effective quota
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /me/export:
    get:
      tags: [me]
      operationId: exportMyData
      security:
        - bearerAuth: []
      summary: Download all account data as JSON (GDPR art. 15/20)
      description: >
        Profile, devices, groups, owned vaults (metadata only), shares and grants, received grants and
        audit entries about the caller. It never contains vault content: private vaults are end-to-end
        encrypted (the server cannot read them) and shared vaults are exported with the vault ZIP export.
        Not part of Specifications.md §3.5 (ADR-0021).
      responses:
        '200':
          description: Account data
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /vaults:
    get:
      tags: [vaults]
      operationId: listVaults
      security:
        - bearerAuth: []
      summary: Own vaults (and, from M4, shared mounts)
      parameters:
        - name: include_deleted
          in: query
          required: false
          description: >-
            Also list the caller's soft-deleted vaults that can still be restored
            (deleted within the retention period, `deleted_at` set); they never
            appear in `mounts`
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Vaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      tags: [vaults]
      operationId: createVault
      security:
        - bearerAuth: []
      summary: Create a vault; `kind` is immutable and private vaults require key envelopes
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVault'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /vaults/{vaultId}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [vaults]
      operationId: getVault
      security:
        - bearerAuth: []
      summary: Vault detail (size, file count, last_seq)
      responses:
        '200':
          description: Vault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [vaults]
      operationId: updateVault
      security:
        - bearerAuth: []
      summary: Rename a vault (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVault'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [vaults]
      operationId: deleteVault
      security:
        - bearerAuth: []
      summary: Soft delete (owner); purged after the retention period
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /vaults/{vaultId}:restore:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    post:
      tags: [vaults]
      operationId: restoreVault
      security:
        - bearerAuth: []
      summary: Restore a soft-deleted vault within the retention period (owner)
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /vaults/{vaultId}/tree:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [vaults]
      operationId: getVaultTree
      security:
        - bearerAuth: []
      summary: Complete manifest of current files plus the changelog position it reflects
      description: >-
        Read from one database snapshot and streamed: an interrupted or failed transfer ends with an
        incomplete JSON document, which the client discards and requests again.
      parameters:
        - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tree'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /vaults/{vaultId}/key-envelopes:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [vaults]
      operationId: getKeyEnvelopes
      security:
        - bearerAuth: []
      summary: Wrapped VMK envelopes of a private vault (owner)
      responses:
        '200':
          description: Envelopes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyEnvelopes'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /vaults/{vaultId}/key-envelopes/{kind}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - name: kind
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/KeyEnvelopeKind'
    put:
      tags: [vaults]
      operationId: putKeyEnvelope
      security:
        - bearerAuth: []
      summary: Replace the passphrase or recovery envelope (change passphrase, new recovery key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyEnvelopeInput'
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /vaults/{vaultId}/changes:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [sync]
      operationId: getChanges
      security:
        - bearerAuth: []
      summary: Changelog entries after a cursor (§3.4.4 B)
      description: >-
        The cursor and the page come from one database snapshot. A cursor is a position (since) and,
        optionally, the identity of the change at that position (since_id, from next_id or the as_of_id of
        /tree): after a point-in-time restore of the server, new commits reuse sequence numbers a device
        already consumed, and only the identity tells them apart (ADR-0046).
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: since_id
          in: query
          required: false
          description: >-
            Id of the change at seq = since, as the client received it (next_id, or as_of_id of /tree).
            When the server has a different change at that seq, the cursor belongs to a timeline the server
            lost (a restored backup): 410 CURSOR_EXPIRED with last_seq. When the change was pruned by
            retention the cursor cannot be verified: 410 CURSOR_EXPIRED with compaction_seq. Ignored with
            since = 0; without it the cursor is not verified (clients before ADR-0046).
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Changes'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '410':
          description: >-
            The cursor is not in the changelog the server serves (code CURSOR_EXPIRED): bootstrap from /tree.
            The extension member compaction_seq marks a cursor older than the changelog window (or whose change
            was pruned); last_seq marks a server that is behind the client, i.e. restored to an earlier point in
            time, with the cursor beyond its end or at a seq now held by another change (ADR-0022, ADR-0046)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /vaults/{vaultId}/blobs:check:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    post:
      tags: [sync]
      operationId: checkBlobs
      security:
        - bearerAuth: []
      summary: Which of these blobs the server does not have yet
      parameters:
        - $ref: '#/components/parameters/Scope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlobCheck'
      responses:
        '200':
          description: Missing hashes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobCheckResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /vaults/{vaultId}/blobs/{sha256}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/Sha256'
    put:
      tags: [sync]
      operationId: putBlob
      security:
        - bearerAuth: []
      summary: Upload a blob up to 32 MB; the server recomputes the hash and rejects a mismatch
      description: >-
        Uploaded bytes are charged to the vault owner only when a commit references them (D-03), but
        until then they count as pending: blobs uploaded within `uploads.expiry_hours` that no
        revision references, plus the resumable uploads in progress. An upload that does not fit in
        the quota next to the used and pending bytes is refused with `413 QUOTA_EXCEEDED`
        (`extra.used_bytes`, `extra.pending_bytes`, `extra.quota_bytes`). A blob the vault already
        holds adds nothing.
      parameters:
        - $ref: '#/components/parameters/Scope'
      requestBody:
        required: false # an empty file is a valid blob (empty body)
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Stored (or already present)
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '413':
          description: 'Blob larger than 32 MB (code FILE_TOO_LARGE) or quota exceeded (QUOTA_EXCEEDED)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    get:
      tags: [sync]
      operationId: getBlob
      security:
        - bearerAuth: []
      summary: Download a blob (Range supported)
      parameters:
        - $ref: '#/components/parameters/Scope'
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Blob bytes
          headers:
            Content-Length:
              schema:
                type: integer
                format: int64
            Accept-Ranges:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content
          headers:
            Content-Range:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '416':
          description: Unsatisfiable range
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /vaults/{vaultId}/commit:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    post:
      tags: [sync]
      operationId: commit
      security:
        - bearerAuth: []
      summary: Apply a batch of operations; each one is evaluated independently (§3.4.4 C)
      description: >-
        Business outcomes are per operation and travel in a 200 response (`accepted`, `conflict`
        or `rejected` with a code): a blob that was never uploaded to the vault is a `rejected`
        operation with code `BLOB_MISSING`, quota and size limits are `QUOTA_EXCEEDED` and
        `FILE_TOO_LARGE`, never an HTTP error of the whole request. The HTTP errors below concern the
        request as a whole (validation, access, body size). A `device_id` revoked from the device
        list is a 403 `FORBIDDEN` with `extra.reason = "device_revoked"`: the client stops
        synchronizing, keeps its pending changes and offers to register the device again. A
        commit through a share whose root moved while the request waited is a 409
        `INVALID_STATE`: its paths were resolved against the old root, so the client pulls and
        tries again.
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Per-operation outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /vaults/{vaultId}/files/{fileId}/revisions:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/FileId'
