openapi: 3.1.0
info:
  title: Nodus Cloud API
  version: 1.0.0-m2
  description: |
    REST contract of the Nodus Cloud Service (Specifications.md §3.1, §3.5).
    This file is the single source of truth: Go server stubs and the TypeScript
    client are generated from it (`make gen`). Endpoints are added milestone by
    milestone; see docs/roadmap.md.

    Conventions: JSON UTF-8, RFC 3339 UTC timestamps, sizes in bytes, UUID v7
    identifiers, errors as `application/problem+json` with an application `code`.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
    description: Health and readiness (no authentication)
  - name: me
    description: Profile, devices and configuration of the authenticated user
  - name: vaults
    description: Vault lifecycle, manifest and encryption key envelopes
  - name: sync
    description: Changelog, blob transfer and commit (§3.4)
  - name: history
    description: File revisions and restore

paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      tags: [system]
      operationId: readyz
      summary: Readiness probe (database, object storage, identity provider reachable)
      security: []
      responses:
        '200':
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /client-config:
    get:
      tags: [system]
      operationId: getClientConfig
      summary: Public bootstrap information for clients (OIDC issuer and client id, notify endpoint)
      description: Lets a desktop client start a login knowing only the server URL (ADR-0008).
      security: []
      responses:
        '200':
          description: Client configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'

  /me:
    get:
      tags: [me]
      operationId: getMe
      security:
        - bearerAuth: []
      summary: Profile, role, effective quota, usage and config version
      description: Provisions the user just-in-time on first login (§1.3).
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /me/devices:
    get:
      tags: [me]
      operationId: listMyDevices
      security:
        - bearerAuth: []
      summary: Registered devices of the current user
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [me]
      operationId: registerDevice
      security:
        - bearerAuth: []
      summary: Register this device and obtain its device_id
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    delete:
      tags: [me]
      operationId: revokeDevice
      security:
        - bearerAuth: []
      summary: Revoke a device
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /config/effective:
    get:
      tags: [me]
      operationId: getEffectiveConfig
      security:
        - bearerAuth: []
      summary: Effective configuration for the current user (product defaults → global → groups → user)
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Effective configuration
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveConfig'
        '304':
          description: Not modified
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /me/usage:
    get:
      tags: [me]
      operationId: getMyUsage
      security:
        - bearerAuth: []
      summary: Storage usage against the effective quota
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /vaults:
    get:
      tags: [vaults]
      operationId: listVaults
      security:
        - bearerAuth: []
      summary: Own vaults (and, from M4, shared mounts)
      responses:
        '200':
          description: Vaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [vaults]
      operationId: createVault
      security:
        - bearerAuth: []
      summary: Create a vault; `kind` is immutable and private vaults require key envelopes
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVault'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /vaults/{vaultId}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [vaults]
      operationId: getVault
      security:
        - bearerAuth: []
      summary: Vault detail (size, file count, last_seq)
      responses:
        '200':
          description: Vault
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [vaults]
      operationId: updateVault
      security:
        - bearerAuth: []
      summary: Rename a vault (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVault'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [vaults]
      operationId: deleteVault
      security:
        - bearerAuth: []
      summary: Soft delete (owner); purged after the retention period
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /vaults/{vaultId}:restore:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    post:
      tags: [vaults]
      operationId: restoreVault
      security:
        - bearerAuth: []
      summary: Restore a soft-deleted vault within the retention period (owner)
      responses:
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '200':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /vaults/{vaultId}/tree:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [vaults]
      operationId: getVaultTree
      security:
        - bearerAuth: []
      summary: Complete manifest of current files plus the changelog position it reflects
      parameters:
        - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tree'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /vaults/{vaultId}/key-envelopes:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [vaults]
      operationId: getKeyEnvelopes
      security:
        - bearerAuth: []
      summary: Wrapped VMK envelopes of a private vault (owner)
      responses:
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '200':
          description: Envelopes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyEnvelopes'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /vaults/{vaultId}/key-envelopes/{kind}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - name: kind
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/KeyEnvelopeKind'
    put:
      tags: [vaults]
      operationId: putKeyEnvelope
      security:
        - bearerAuth: []
      summary: Replace the passphrase or recovery envelope (change passphrase, new recovery key)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyEnvelopeInput'
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /vaults/{vaultId}/changes:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [sync]
      operationId: getChanges
      security:
        - bearerAuth: []
      summary: Changelog entries after a cursor (§3.4.4 B)
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - $ref: '#/components/parameters/Scope'
      responses:
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '200':
          description: Changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Changes'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: 'The cursor predates the compaction window (code CURSOR_EXPIRED): bootstrap from /tree'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /vaults/{vaultId}/blobs:check:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    post:
      tags: [sync]
      operationId: checkBlobs
      security:
        - bearerAuth: []
      summary: Which of these blobs the server does not have yet
      parameters:
        - $ref: '#/components/parameters/Scope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlobCheck'
      responses:
        '200':
          description: Missing hashes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlobCheckResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /vaults/{vaultId}/blobs/{sha256}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/Sha256'
    put:
      tags: [sync]
      operationId: putBlob
      security:
        - bearerAuth: []
      summary: Upload a blob up to 32 MB; the server recomputes the hash and rejects a mismatch
      parameters:
        - $ref: '#/components/parameters/Scope'
      requestBody:
        required: false # an empty file is a valid blob (empty body)
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Stored (or already present)
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: 'Blob larger than 32 MB (code FILE_TOO_LARGE) or quota exceeded (QUOTA_EXCEEDED)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      tags: [sync]
      operationId: getBlob
      security:
        - bearerAuth: []
      summary: Download a blob (Range supported)
      parameters:
        - $ref: '#/components/parameters/Scope'
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Blob bytes
          headers:
            Content-Length:
              schema:
                type: integer
                format: int64
            Accept-Ranges:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content
          headers:
            Content-Range:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Unsatisfiable range
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /vaults/{vaultId}/commit:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    post:
      tags: [sync]
      operationId: commit
      security:
        - bearerAuth: []
      summary: Apply a batch of operations; each one is evaluated independently (§3.4.4 C)
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Per-operation outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /vaults/{vaultId}/files/{fileId}/revisions:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [history]
      operationId: listRevisions
      security:
        - bearerAuth: []
      summary: History of a file, newest first
      parameters:
        - $ref: '#/components/parameters/Scope'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /vaults/{vaultId}/files/{fileId}/revisions/{rev}/content:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/Rev'
    get:
      tags: [history]
      operationId: getRevisionContent
      security:
        - bearerAuth: []
      summary: Content of a revision (ciphertext for private vaults)
      parameters:
        - $ref: '#/components/parameters/Scope'
      responses:
        '200':
          description: Blob bytes
          headers:
            Content-Length:
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /vaults/{vaultId}/files/{fileId}/revisions/{rev}:restore:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/Rev'
    post:
      tags: [history]
      operationId: restoreRevision
      security:
        - bearerAuth: []
      summary: Restore a revision as a new revision that reuses its blob
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '200':
          description: Restored; the result carries the new revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/groups:
    get:
      tags: [directory]
      operationId: listMyGroups
      security:
        - bearerAuth: []
      summary: Groups the caller belongs to
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMembership'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /directory/users:
    get:
      tags: [directory]
      operationId: searchDirectoryUsers
      security:
        - bearerAuth: []
      summary: Find users to share with (minimal fields)
      parameters:
        - $ref: '#/components/parameters/DirectoryQuery'
      responses:
        '200':
          description: Matches, at most 20
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /directory/groups:
    get:
      tags: [directory]
      operationId: searchDirectoryGroups
      security:
        - bearerAuth: []
      summary: Find groups to share with (minimal fields)
      parameters:
        - $ref: '#/components/parameters/DirectoryQuery'
      responses:
        '200':
          description: Matches, at most 20
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryGroup'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /shares:
    get:
      tags: [sharing]
      operationId: listShares
      security:
        - bearerAuth: []
      summary: Shares the caller owns or manages (`owned`) or was invited to (`received`)
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [owned, received]
      responses:
        '200':
          description: Shares
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Share'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [sharing]
      operationId: createShare
      security:
        - bearerAuth: []
      summary: Share a vault, a folder or a document (shared vaults only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShare'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /shares/{shareId}:
    parameters:
      - $ref: '#/components/parameters/SharePathId'
    get:
      tags: [sharing]
      operationId: getShare
      security:
        - bearerAuth: []
      summary: A share, with its grants for managers and the owner
      responses:
        '200':
          description: Share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [sharing]
      operationId: updateShare
      security:
        - bearerAuth: []
      summary: Rename a share or change its expiry (manager or owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShare'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [sharing]
      operationId: revokeShare
      security:
        - bearerAuth: []
      summary: Revoke a share (owner of the vault)
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /shares/{shareId}/grants/{principalType}/{principalId}:
    parameters:
      - $ref: '#/components/parameters/SharePathId'
      - $ref: '#/components/parameters/PrincipalType'
      - $ref: '#/components/parameters/PrincipalId'
    put:
      tags: [sharing]
      operationId: putGrant
      security:
        - bearerAuth: []
