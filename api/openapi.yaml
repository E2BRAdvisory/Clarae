      description: >-
        A user has at most `exports.max_active_per_user` (default 3) archives being streamed at
        once by a node of the service; beyond that the request is refused with `429 RATE_LIMITED`
        (`extra.limit`, `extra.active_streams`).
      responses:
        '200':
          description: ZIP archive
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationFailed'
