        total_bytes: {type: integer, format: int64}
        file_count: {type: integer}
        created_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
    UserSession:
      type: object
      required: [id, started, last_access]
      properties:
        id: {type: string}
        ip_address: {type: string}
        started: {type: string, format: date-time}
        last_access: {type: string, format: date-time}
        clients:
          type: array
          items: {type: string}
    AdminGroup:
      type: object
      required: [id, name, member_count, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        member_count: {type: integer}
        created_at: {type: string, format: date-time}
    GroupInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 500}
    GroupMember:
      type: object
      required: [user_id, username, member_role]
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string}
        email: {type: string}
        display_name: {type: string}
        member_role: {type: string, enum: [member, manager]}
    SetMemberRole:
      type: object
      required: [member_role]
      properties:
        member_role: {type: string, enum: [member, manager]}
    ProfileAssignment:
      type: object
      required: [profile_id, priority]
      properties:
        profile_id: {type: string, format: uuid}
        priority: {type: integer, description: 'Higher wins'}
    ProfileAssignments:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProfileAssignment'}
    ConfigProfile:
      type: object
      required: [id, name, is_global, version, config, locked_keys, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        is_global: {type: boolean}
        version: {type: integer}
        config: {type: object, additionalProperties: true}
        locked_keys:
          type: array
          items: {type: string}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
    ConfigProfileInput:
      type: object
      required: [name, config]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 500}
        is_global: {type: boolean}
        config: {type: object, additionalProperties: true}
        locked_keys:
          type: array
          items: {type: string}
    ProfileVersion:
      type: object
      required: [version, name, is_global, config, locked_keys, updated_at]
      properties:
        version: {type: integer}
        name: {type: string}
        description: {type: string}
        is_global: {type: boolean}
        config: {type: object, additionalProperties: true}
        locked_keys:
          type: array
          items: {type: string}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
    StorageSettings:
      type: object
      required: [default_quota_bytes, warn_percent, critical_percent, history_retention_days, history_daily_retention_days, max_file_size_bytes]
      properties:
        default_quota_bytes: {type: integer, format: int64, minimum: 0}
        warn_percent: {type: integer, minimum: 1, maximum: 100}
        critical_percent: {type: integer, minimum: 1, maximum: 100}
        history_retention_days: {type: integer, minimum: 1}
        history_daily_retention_days: {type: integer, minimum: 1}
        max_file_size_bytes: {type: integer, format: int64, minimum: 1024}
    TopConsumer:
      type: object
      required: [user_id, username, used_bytes, quota_bytes]
      properties:
