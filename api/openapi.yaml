  /directory/users:
    get:
      tags: [directory]
      operationId: searchDirectoryUsers
      security:
        - bearerAuth: []
      summary: Find users to share with (minimal fields)
      description: >-
        q matches a substring of the username or display name (`%` and `_` are literal), or a
        whole e-mail address, case-insensitively. A part of an address never matches, so the
        directory cannot be used to guess addresses (ADR-0041). E-mail addresses are never returned.
      parameters:
        - $ref: '#/components/parameters/DirectoryQuery'
      responses:
        '200':
          description: Matches, at most 20
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectoryUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
