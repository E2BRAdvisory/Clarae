  /vaults/{vaultId}/exports:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    post:
      tags: [export]
      operationId: createExport
      security:
        - bearerAuth: []
      summary: Start an export job (any size); the ZIP is built in the background
      description: >-
        A vault has at most one job queued or running: a new request returns that job. A ready
        job built from the vault as it is now (nothing committed since) and downloadable for at
        least another hour is returned as well, instead of building the same archive again. A user
        has at most `exports.max_active_per_user` (default 3) jobs queued or running; beyond that
        the request is refused with `429 RATE_LIMITED` (`extra.limit`, `extra.active_exports`).
        Once a new archive is ready, the older ones of the vault stay downloadable for at most one
        more hour. A job that is cancelled (the account or the vault was deleted) ends `failed`.
      responses:
        '202':
          description: Accepted (a new job, the one already queued or running for the vault, or a ready one of the unchanged vault)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
