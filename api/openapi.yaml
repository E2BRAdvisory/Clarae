        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token with `aud=clarae-api`
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://keycloak.example.com/realms/clarae/.well-known/openid-configuration
      description: >-
        Where clients obtain the access token used as `bearerAuth` (documentation only: no operation
        references this scheme). The URL is `<issuer>/.well-known/openid-configuration`, where the
        issuer is the Keycloak realm URL (`OIDC_ISSUER`, also returned by `GET /client-config`). The
        desktop uses Authorization Code + PKCE with its own public client, the Web UI another public
        client (`desktop_client_id`, `web_client_id`).

  parameters:
    VaultId:
      name: vaultId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Rev:
      name: rev
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Sha256:
      name: sha256
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserPathId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupPathId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfilePathId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionPathId:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ExportPathId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      required: false
      description: >-
        Work through a share instead of owning the vault (`share:{id}`, §3.4.7). Paths are then
        relative to the root of the share and every operation is checked against the caller's
        permission on it.
      schema:
        type: string
    SharePathId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PrincipalType:
      name: principalType
      in: path
      required: true
      schema:
        type: string
        enum: [user, group]
    PrincipalId:
      name: principalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size (see Pagination)
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    PageCursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page; omitted for the first page (see Pagination)
      schema:
        type: string
        maxLength: 2048
    DirectoryQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Client-chosen key that makes a mutating POST safe to retry: send a new random key per
        logical operation and the same key on every retry of it. A retry of an attempt that
        succeeded gets that attempt's outcome; on `POST /vaults` and `POST /me/devices` it is the
        resource created then, as it is now, with `201` again. Reusing a key for a vault of the
        other kind, or a device of another platform, is `400 VALIDATION_FAILED`.
      schema:
        type: string
        maxLength: 128

  responses:
    Unauthenticated:
      description: Missing or invalid token (code UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >-
        Not allowed: the caller lacks the permission or role the operation checks (code FORBIDDEN),
        or the account is suspended or deleted (code USER_SUSPENDED, possible on every authenticated
        operation)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or not visible to the caller (code NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Request does not satisfy the schema (code VALIDATION_FAILED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        Conflict with the current state. Depending on the operation: VAULT_KIND_IMMUTABLE,
        VAULT_ENCRYPTED, PATH_COLLISION, NAME_IN_USE, REV_CONFLICT (an `expected_version` that is
        no longer current), SHARE_ROOT_MOVE or INVALID_STATE (the operation is not allowed in the
        current state; the problem's `detail` says why). Like every authenticated operation, also
        INVALID_STATE when the identity of the token conflicts with an existing account (see
        `IdentityConflict`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdentityConflict:
      description: >-
        The identity of the token cannot be linked to a Clarae account (code INVALID_STATE,
        ADR-0041): another account already uses the same e-mail address. Possible on every
        authenticated operation; an administrator has to resolve it, so retrying does not help
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: >-
        Too many requests from this client address (code RATE_LIMITED; the problem carries
        `retry_after`). Applies to every route; retry after the given number of seconds
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
        RateLimit-Limit:
          description: Size of the client's bucket (burst)
          schema:
            type: integer
        RateLimit-Remaining:
          description: Requests left in the bucket (0 on this answer)
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Request body larger than 8 MiB (code FILE_TOO_LARGE)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server failure (code INTERNAL, HTTP 500); the problem carries the request id to quote
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    ClientConfig:
      type: object
      required: [issuer, desktop_client_id, web_client_id, audience, grpc_endpoint, api_version]
      properties:
        issuer:
          type: string
          format: uri
          description: OIDC issuer (Keycloak realm URL)
        desktop_client_id:
          type: string
        web_client_id:
          type: string
          description: Public OIDC client of the Web UI (Authorization Code + PKCE)
        audience:
          type: string
          description: Expected `aud` of access tokens
        grpc_endpoint:
          type: string
          description: host:port of the NotifyService stream
        api_version:
          type: string
          description: Server version

    Problem:
      type: object
      description: RFC 9457 problem details with the Clarae notanda application code
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        request_id:
          type: string
        extra:
          type: object
          additionalProperties: true

    ErrorCode:
      type: string
      description: Application error codes (§3.1); mirrored in shared/go/syncproto
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - USER_SUSPENDED
        - NOT_FOUND
        - VALIDATION_FAILED
        - QUOTA_EXCEEDED
        - FILE_TOO_LARGE
        - REV_CONFLICT
        - PATH_INVALID
        - PATH_COLLISION
        - SHARE_ROOT_MOVE
        - BLOB_MISSING
        - VAULT_ENCRYPTED
        - VAULT_KIND_IMMUTABLE
        - RATE_LIMITED
        - CURSOR_EXPIRED
        - NAME_IN_USE
        - INVALID_STATE
        - INTERNAL

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
          description: Per-dependency status (database, storage, oidc)
        version:
          type: string

    Role:
      type: string
      enum: [admin, user]

    UserStatus:
      type: string
      enum: [pending, active, suspended, deleted]

    Me:
      type: object
      required:
        [id, username, email, role, status, quota_bytes, used_bytes, config_version, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        quota_bytes:
          type: integer
          format: int64
          description: Effective quota; -1 means unlimited
        used_bytes:
          type: integer
          format: int64
        config_version:
          type: integer
          description: >-
            Revision of the configuration: the `version` of /config/effective and of the
            ConfigChanged notification events (§3.6). Compare it with the one you hold to refetch.
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    DeviceRegistration:
      type: object
      required: [name, platform]
      properties:
        name:
          type: string
          maxLength: 120
          description: Human readable device name (host name by default)
        platform:
          type: string
          enum: [windows, macos, linux, web]
        app_version:
          type: string
          maxLength: 64

    Device:
      type: object
      required: [id, name, platform, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
        app_version:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    EffectiveConfig:
      type: object
      required: [version, config, locked_keys]
      properties:
        version:
          type: integer
        config:
          type: object
          additionalProperties: true
          description: Validated against api/config-profile.schema.json (M4)
        locked_keys:
          type: array
          items:
            type: string
          description: Dotted keys the user cannot override

    AccountDeletionRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Must equal the caller's username
        acknowledge_data_loss:
          type: boolean
          description: Required when the caller owns private (end-to-end encrypted) vaults

    AccountExport:
      type: object
      required: [generated_at, profile, devices, groups, vaults, shares, received_grants, audit_log]
      properties:
        generated_at:
          type: string
          format: date-time
        notice:
          type: string
        profile:
          type: object
          additionalProperties: true
        devices:
          type: array
          items:
            type: object
            additionalProperties: true
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
        vaults:
          type: array
          items:
            type: object
            additionalProperties: true
        shares:
          type: array
          items:
            type: object
            additionalProperties: true
        received_grants:
          type: array
          items:
            type: object
            additionalProperties: true
        audit_log:
          type: array
          items:
            type: object
            additionalProperties: true

    Usage:
      type: object
      required: [used_bytes, quota_bytes, level]
      properties:
        used_bytes:
          type: integer
          format: int64
        quota_bytes:
          type: integer
          format: int64
          description: -1 means unlimited
        level:
          type: string
          enum: [ok, warning, critical, full]
          description: 'ok below 80 %, warning from 80 %, critical from 95 %, full at 100 %'

    VaultKind:
      type: string
      enum: [private, shared]

    Vault:
      type: object
      required: [id, owner_id, name, kind, last_seq, total_bytes, file_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/VaultKind'
        last_seq:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
        file_count:
          type: integer
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    VaultList:
      type: object
      required: [items, mounts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vault'
        mounts:
          type: array
          description: 'Always empty: shares received from other owners are listed by GET /shares?scope=received (kept for compatibility)'
          items:
            $ref: '#/components/schemas/Vault'

    CreateVault:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: '#/components/schemas/VaultKind'
        key_envelopes:
          type: array
          description: 'Both the passphrase and the recovery envelope: required for private vaults, forbidden for shared ones'
          items:
            $ref: '#/components/schemas/KeyEnvelopeInput'

    UpdateVault:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    KeyEnvelopeKind:
      type: string
      enum: [passphrase, recovery]

    KdfParams:
      type: object
      required: [alg, salt]
      properties:
        alg:
          type: string
          enum: [argon2id, hkdf-sha256]
        t:
          type: integer
        m_kib:
          type: integer
        p:
          type: integer
        salt:
          type: string
          description: Standard base64

    KeyEnvelopeInput:
      type: object
      required: [kind, kdf, wrapped_vmk]
      properties:
        kind:
          $ref: '#/components/schemas/KeyEnvelopeKind'
        kdf:
          $ref: '#/components/schemas/KdfParams'
        wrapped_vmk:
          type: string
          format: byte
          description: 'Standard base64. v1 (60 bytes): nonce ‖ AES-256-GCM(KEK, VMK) ‖ tag; v2 (61 bytes, ADR-0034): 0x02 ‖ nonce ‖ AES-256-GCM(KEK, VMK; AAD) ‖ tag'

    KeyEnvelope:
      allOf:
        - $ref: '#/components/schemas/KeyEnvelopeInput'
        - type: object
          required: [created_at]
          properties:
            created_at:
              type: string
              format: date-time

    KeyEnvelopes:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KeyEnvelope'

    TreeEntry:
      type: object
      required: [path, file_id, rev, hash, size, kind]
      properties:
        path:
          type: string
        file_id:
          type: string
          format: uuid
        rev:
          type: integer
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        size:
          type: integer
          format: int64
        kind:
          type: string

    Tree:
      type: object
      required: [items, as_of_seq]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TreeEntry'
        as_of_seq:
          type: integer
          format: int64
          description: 'The changelog position the manifest reflects: continue with changes?since=as_of_seq'
        as_of_id:
          type: string
          format: uuid
          description: >-
            Id of the change at as_of_seq, to send as since_id with it (ADR-0046). Absent when there is none
            (an empty vault, or a change pruned by retention)

    ChangeOp:
      type: string
      enum: [create, modify, move, delete, restore]

    Change:
      type: object
      required: [seq, file_id, op, path, rev, size, author_id, server_time]
      properties:
        seq:
          type: integer
          format: int64
        file_id:
          type: string
          format: uuid
        op:
          $ref: '#/components/schemas/ChangeOp'
        path:
          type: string
        prev_path:
          type: string
        rev:
          type: integer
        blob_hash:
          type: string
        size:
          type: integer
          format: int64
        author_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        server_time:
          type: string
          format: date-time
        conflict_of:
          type: string
          format: uuid
          description: 'Set on a conflict copy: the file it was derived from'

    Changes:
      type: object
      required: [items, next_seq, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Change'
        next_seq:
          type: integer
          format: int64
        next_id:
          type: string
          format: uuid
          description: >-
            Id of the change at next_seq, to send as since_id with it (ADR-0046). Absent when there is none
            (next_seq 0, or a change pruned by retention)
        has_more:
          type: boolean

    BlobCheck:
      type: object
      required: [hashes]
      properties:
        hashes:
          type: array
          maxItems: 1000
          items:
            type: string
            pattern: '^[0-9a-f]{64}$'

    BlobCheckResult:
      type: object
      required: [missing]
      properties:
        missing:
          type: array
          items:
            type: string

    CommitOpKind:
      type: string
      enum: [create, modify, move, delete, restore, move_prefix]

    CommitOp:
      type: object
      required: [op_id, op]
      properties:
        op_id:
          type: string
          format: uuid
        op:
          $ref: '#/components/schemas/CommitOpKind'
        file_id:
          type: string
          format: uuid
        path:
          type: string
          maxLength: 1100
        path_key:
          type: string
          maxLength: 128
          description: "Private vaults only: 'hmac1:<hex>' identity of the path, since the server cannot derive it from the opaque token (ADR-0009)"
        base_rev:
          type: integer
          minimum: 0
        blob_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        size:
          type: integer
          format: int64
          minimum: 0
        client_mtime:
          type: string
          format: date-time
        conflict_of:
          type: string
          format: uuid
          description: 'Marks a conflict copy (create only)'
        from:
          type: string
        to:
          type: string

    CommitRequest:
      type: object
      required: [device_id, ops]
      properties:
        device_id:
          type: string
          format: uuid
        ops:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/CommitOp'

    OpResult:
      type: object
      required: [op_id, status]
      properties:
        op_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, conflict, rejected]
        file_id:
          type: string
          format: uuid
        rev:
          type: integer
        seq:
          type: integer
          format: int64
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        current_rev:
          type: integer
        current_hash:
          type: string
        current_seq:
          type: integer
          format: int64

    CommitResponse:
      type: object
      required: [results, last_seq]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/OpResult'
        last_seq:
          type: integer
          format: int64

    Revision:
      type: object
      required: [rev, seq, op, path, size, author_id, server_time]
      properties:
        rev:
          type: integer
        seq:
          type: integer
          format: int64
        op:
          $ref: '#/components/schemas/ChangeOp'
        path:
          type: string
        prev_path:
          type: string
        blob_hash:
          type: string
        size:
          type: integer
          format: int64
        author_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        server_time:
          type: string
          format: date-time
        conflict_of:
          type: string
          format: uuid

    RevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
        next_cursor:
          type: string

    GroupMembership:
      type: object
      required: [id, name, member_role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        member_role:
          type: string
          enum: [member, manager]
          description: Role inside the group. `manager` is reserved in v1 and grants no extra capability (ADR-0041).

    DirectoryUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string

    DirectoryGroup:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    ResourceType:
      type: string
      enum: [vault, folder, file]

    SharePermission:
      type: string
      enum: [viewer, editor, manager]

    GrantStatus:
      type: string
      enum: [pending, accepted, declined]

    Grant:
      type: object
      required: [principal_type, principal_id, principal_name, permission, status, created_at]
      properties:
        principal_type:
          type: string
          enum: [user, group]
        principal_id:
          type: string
          format: uuid
        principal_name:
          type: string
        permission:
          $ref: '#/components/schemas/SharePermission'
        status:
          $ref: '#/components/schemas/GrantStatus'
        granted_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    GrantInput:
      type: object
      required: [permission]
      properties:
        permission:
          $ref: '#/components/schemas/SharePermission'

    NewGrant:
      type: object
      required: [principal_type, principal_id, permission]
      properties:
        principal_type:
          type: string
          enum: [user, group]
        principal_id:
          type: string
          format: uuid
        permission:
          $ref: '#/components/schemas/SharePermission'

    Share:
      type: object
      required:
        [id, vault_id, vault_name, resource_type, display_name, owner_id, owner_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        vault_id:
          type: string
          format: uuid
        vault_name:
          type: string
        resource_type:
          $ref: '#/components/schemas/ResourceType'
        path_prefix:
          type: string
          description: Folder shares; only shown to the owner and managers
        file_id:
          type: string
          format: uuid
        display_name:
          type: string
        owner_id:
          type: string
          format: uuid
        owner_name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        my_permission:
          $ref: '#/components/schemas/SharePermission'
        my_status:
          $ref: '#/components/schemas/GrantStatus'
        grants:
          type: array
          description: Only for the owner and managers
          items:
            $ref: '#/components/schemas/Grant'

    CreateShare:
      type: object
      required: [vault_id, resource_type, display_name]
      properties:
        vault_id:
          type: string
          format: uuid
        resource_type:
          $ref: '#/components/schemas/ResourceType'
        path_prefix:
          type: string
        file_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        expires_at:
          type: string
          format: date-time
        grants:
          type: array
          items:
            $ref: '#/components/schemas/NewGrant'

    UpdateShare:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        expires_at:
          type: string
          format: date-time
        clear_expiry:
          type: boolean
          description: Remove the expiry (instead of setting expires_at)

    SharePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Share' }
        next_cursor: { type: string, description: 'Absent on the last page' }
    MountPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Mount' }
        next_cursor: { type: string, description: 'Absent on the last page' }
    Mount:
      type: object
      required: [share_id, vault_id, display_name, resource_type, permission, scope, owner_name]
      properties:
        share_id:
          type: string
          format: uuid
        vault_id:
          type: string
          format: uuid
        display_name:
          type: string
        resource_type:
          $ref: '#/components/schemas/ResourceType'
        permission:
          $ref: '#/components/schemas/SharePermission'
        scope:
          type: string
          description: Value of the `scope` parameter that syncs this mount (`share:{id}`)
        owner_name:
          type: string
        expires_at:
          type: string
          format: date-time

    AdminUser:
      type: object
      required: [id, username, email, role, status, quota_bytes, used_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        quota_bytes_override:
          type: integer
          format: int64
          nullable: true
          description: null = the global default, -1 = unlimited
        quota_bytes:
          { type: integer, format: int64, description: 'Effective quota, -1 = unlimited' }
        used_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    AdminUserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        total: { type: integer }
    CreateAdminUser:
      type: object
      required: [username, email]
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        display_name: { type: string, maxLength: 200 }
        role: { $ref: '#/components/schemas/Role' }
        temporary_password:
          type: string
          minLength: 8
          description: Optional; the user must change it at the first login
    UpdateAdminUser:
      type: object
      properties:
        display_name: { type: string, maxLength: 200 }
        email: { type: string, format: email }
    SetRole:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
    SetQuota:
      type: object
      properties:
        quota_bytes:
          type: integer
          format: int64
          nullable: true
          minimum: -1
          description: Omitted or null = the global default, -1 = unlimited
    ResetPasswordResult:
      type: object
      required: [email_sent]
      properties:
        email_sent:
          {
            type: boolean,
            description: 'False when Keycloak could not send the e-mail; the new password is still required at the next login',
          }
    AdminVault:
      type: object
      required: [id, name, kind, total_bytes, file_count, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/VaultKind' }
        total_bytes: { type: integer, format: int64 }
        file_count: { type: integer }
        created_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
    UserSession:
      type: object
      required: [id, started, last_access]
      properties:
        id: { type: string }
        ip_address: { type: string }
        started: { type: string, format: date-time }
        last_access: { type: string, format: date-time }
        clients:
          type: array
          items: { type: string }
    AdminGroup:
      type: object
      required: [id, name, member_count, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        member_count: { type: integer }
        created_at: { type: string, format: date-time }
    AdminGroupPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminGroup' }
        next_cursor: { type: string, description: 'Absent on the last page' }
    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
    GroupMember:
      type: object
      required: [user_id, username, member_role]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        display_name: { type: string }
        member_role: { type: string, enum: [member, manager] }
    GroupMemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }
        next_cursor: { type: string, description: 'Absent on the last page' }
    SetMemberRole:
      type: object
      required: [member_role]
      properties:
        member_role: { type: string, enum: [member, manager] }
    ProfileAssignment:
      type: object
      required: [profile_id, priority]
      properties:
        profile_id: { type: string, format: uuid }
        priority: { type: integer, description: 'Higher wins' }
    ProfileAssignments:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProfileAssignment' }
    ConfigProfile:
      type: object
      required: [id, name, is_global, version, config, locked_keys, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        is_global: { type: boolean }
        version: { type: integer }
        config: { type: object, additionalProperties: true }
        locked_keys:
          type: array
          items: { type: string }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    ConfigProfileInput:
      type: object
      required: [name, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        is_global: { type: boolean }
        config: { type: object, additionalProperties: true }
        locked_keys:
          type: array
          items: { type: string }
        expected_version:
          type: integer
          minimum: 1
          description: >-
            Optimistic concurrency on update (PUT): the `version` the change was made from. When
            the profile is at another version the update is refused with 409 REV_CONFLICT and
            nothing changes. Omitted, the update replaces whatever version is current. Ignored on
            create.
    ProfileVersion:
      type: object
      required: [version, name, is_global, config, locked_keys, updated_at]
      properties:
        version: { type: integer }
        name: { type: string }
        description: { type: string }
        is_global: { type: boolean }
        config: { type: object, additionalProperties: true }
        locked_keys:
          type: array
          items: { type: string }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    ProfileVersionSummary:
      type: object
      description: A version of a profile without its configuration (adminGetProfileVersion has it)
      required: [version, name, is_global, updated_at]
      properties:
        version: { type: integer }
        name: { type: string }
        description: { type: string }
        is_global: { type: boolean }
        updated_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }
    ProfileVersionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProfileVersionSummary' }
        next_cursor: { type: string, description: 'Absent on the last page' }
    StorageSettings:
      type: object
      required:
        [
          default_quota_bytes,
          warn_percent,
          critical_percent,
          history_retention_days,
          history_daily_retention_days,
          max_file_size_bytes,
        ]
      properties:
        default_quota_bytes: { type: integer, format: int64, minimum: 0 }
        warn_percent: { type: integer, minimum: 1, maximum: 100 }
        critical_percent: { type: integer, minimum: 1, maximum: 100 }
        history_retention_days: { type: integer, minimum: 1 }
        history_daily_retention_days: { type: integer, minimum: 1 }
        max_file_size_bytes: { type: integer, format: int64, minimum: 1024 }
    TopConsumer:
      type: object
      required: [user_id, username, used_bytes, quota_bytes]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        used_bytes: { type: integer, format: int64 }
        quota_bytes: { type: integer, format: int64 }
    TrendPoint:
      type: object
      required: [day, total_bytes]
      properties:
        day: { type: string, format: date }
        total_bytes: { type: integer, format: int64 }
    StorageOverview:
      type: object
      required:
        [
          default_quota_bytes,
          total_used_bytes,
          user_count,
          users_over_warn,
          users_over_critical,
          top_consumers,
          trend,
        ]
      properties:
        default_quota_bytes: { type: integer, format: int64 }
        total_used_bytes: { type: integer, format: int64 }
        user_count: { type: integer }
        users_over_warn: { type: integer }
        users_over_critical: { type: integer }
        top_consumers:
          type: array
          items: { $ref: '#/components/schemas/TopConsumer' }
        trend:
          type: array
          items: { $ref: '#/components/schemas/TrendPoint' }
    BulkQuota:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }
        quota_bytes: { type: integer, format: int64, nullable: true, minimum: -1 }
    BulkQuotaResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }
    AuditEntry:
      type: object
      required: [id, at, action]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        actor_name: { type: string }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        details: { type: object, additionalProperties: true }
        ip: { type: string }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        next_cursor: { type: string }
    ExportJob:
      type: object
      required: [id, vault_id, status, created_at]
      properties:
        id: { type: string, format: uuid }
        vault_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, ready, failed, expired] }
        size: { type: integer, format: int64 }
        error:
          {
            type: string,
            description: 'Why a failed job failed, as a short generic message (the details are in the server log)',
          }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        download_url: { type: string, description: 'Where to download a ready export' }
