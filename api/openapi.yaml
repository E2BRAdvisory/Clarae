        default:
          $ref: '#/components/responses/InternalError'

  /shares:
    get:
      tags: [sharing]
      operationId: listShares
      security:
        - bearerAuth: []
      summary: Shares the caller owns or manages (`owned`) or was invited to (`received`)
      description: >-
        Newest share first, keyset paginated (see Pagination). `owned` lists the shares of the
        caller's vaults and those they manage; `received` the shares that reach them: pending
        invitations and accepted shares.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [owned, received]
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: A page of shares
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      tags: [sharing]
      operationId: createShare
      security:
        - bearerAuth: []
      summary: Share a vault, a folder or a document (shared vaults only)
      description: >-
        The owner of the vault, or a manager (ADR-0041 §8): a user holding an accepted `manager`
        grant, directly or through a group, on a live share (not revoked, not expired) of the same
        vault may share what lies inside that share's scope: anything under a vault share, the
        folder itself, a subfolder or a document below it under a folder share (paths compared like
        `path_key`: NFC, case-insensitive), only the same document under a document share. Initial
        grants go up to `manager` for everyone. A scope outside every share the caller manages is
        `403 FORBIDDEN`; a vault where the caller is neither owner nor manager answers 404; a
        private vault is `409 VAULT_ENCRYPTED` (D-02). The new share belongs to the vault: its owner
        sees, changes and revokes it; `created_by` (audit `share.create`, with `via_share`) is the
        manager, who manages it (rename, expiry, grants, not revocation) while they still manage a
        live share around it, and sees it with `my_permission: manager` in `scope=owned`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShare'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/InternalError'

  /shares/{shareId}:
    parameters:
      - $ref: '#/components/parameters/SharePathId'
    get:
      tags: [sharing]
      operationId: getShare
      security:
        - bearerAuth: []
      summary: A share, with its grants for managers and the owner
      responses:
        '200':
          description: Share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '401':
