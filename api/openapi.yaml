          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/storage/bulk-quota:
    post:
      tags: [admin]
      operationId: adminBulkQuota
      security:
        - bearerAuth: []
      summary: Set the quota override of several users at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkQuota'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkQuotaResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/ValidationFailed'

  /admin/audit-log:
    get:
      tags: [admin]
      operationId: adminAuditLog
      security:
        - bearerAuth: []
      summary: Audit trail, newest first
      parameters:
        - name: actor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: target
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/ValidationFailed'

  /admin/audit-log.csv:
    get:
      tags: [admin]
      operationId: adminAuditLogCsv
      security:
        - bearerAuth: []
      summary: The audit trail as CSV (same filters, up to 50000 rows)
      parameters:
        - name: actor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: target
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/ValidationFailed'

  /vaults/{vaultId}/export.zip:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    get:
      tags: [export]
      operationId: exportVaultZip
      security:
        - bearerAuth: []
      summary: Stream the vault as a ZIP (shared vaults of the caller, up to 512 MB)
      responses:
        '200':
          description: ZIP archive
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /vaults/{vaultId}/exports:
    parameters:
      - $ref: '#/components/parameters/VaultId'
    post:
      tags: [export]
      operationId: createExport
      security:
        - bearerAuth: []
      summary: Start an export job (any size); the ZIP is built in the background
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /vaults/{vaultId}/exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/ExportPathId'
    get:
      tags: [export]
      operationId: getExport
      security:
        - bearerAuth: []
      summary: State of an export job
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /vaults/{vaultId}/exports/{exportId}/download:
    parameters:
      - $ref: '#/components/parameters/VaultId'
      - $ref: '#/components/parameters/ExportPathId'
    get:
      tags: [export]
      operationId: downloadExport
      security:
        - bearerAuth: []
      summary: Download the ZIP of a ready export (valid 24 hours)
      responses:
        '200':
          description: ZIP archive
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token with `aud=nodus-api`

  parameters:
    VaultId:
      name: vaultId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Rev:
      name: rev
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Sha256:
      name: sha256
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserPathId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupPathId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfilePathId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionPathId:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ExportPathId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Scope:
      name: scope
      in: query
      required: false
      description: >-
        Work through a share instead of owning the vault (`share:{id}`, §3.4.7). Paths are then
        relative to the root of the share and every operation is checked against the caller's
        permission on it.
      schema:
        type: string
    SharePathId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PrincipalType:
      name: principalType
      in: path
      required: true
      schema:
        type: string
        enum: [user, group]
    PrincipalId:
      name: principalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DirectoryQuery:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen key that makes a mutating POST safe to retry
      schema:
        type: string
        maxLength: 128

  responses:
    Unauthenticated:
      description: Missing or invalid token (code UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed (code FORBIDDEN or USER_SUSPENDED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or not visible to the caller (code NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Request does not satisfy the schema (code VALIDATION_FAILED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'State conflict (code VAULT_KIND_IMMUTABLE, VAULT_ENCRYPTED, PATH_COLLISION or NAME_IN_USE)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests (code RATE_LIMITED); honour Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    ClientConfig:
      type: object
      required: [issuer, desktop_client_id, web_client_id, audience, grpc_endpoint, api_version]
      properties:
        issuer:
          type: string
          format: uri
          description: OIDC issuer (Keycloak realm URL)
        desktop_client_id:
          type: string
        web_client_id:
          type: string
          description: Public OIDC client of the Web UI (Authorization Code + PKCE)
        audience:
          type: string
          description: Expected `aud` of access tokens
        grpc_endpoint:
          type: string
          description: host:port of the NotifyService stream
        api_version:
          type: string
          description: Server version

    Problem:
      type: object
      description: RFC 9457 problem details with the Nodus application code
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        request_id:
          type: string
        extra:
          type: object
          additionalProperties: true

    ErrorCode:
      type: string
      description: Application error codes (§3.1); mirrored in shared/go/syncproto
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN
        - USER_SUSPENDED
        - NOT_FOUND
        - VALIDATION_FAILED
        - QUOTA_EXCEEDED
        - FILE_TOO_LARGE
        - REV_CONFLICT
        - PATH_INVALID
        - PATH_COLLISION
        - SHARE_ROOT_MOVE
        - BLOB_MISSING
        - VAULT_ENCRYPTED
        - VAULT_KIND_IMMUTABLE
        - RATE_LIMITED
        - CURSOR_EXPIRED
        - NAME_IN_USE
        - INVALID_STATE
        - INTERNAL

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
          description: Per-dependency status (database, storage, oidc)
        version:
          type: string

    Role:
      type: string
      enum: [admin, user]

    UserStatus:
      type: string
      enum: [pending, active, suspended, deleted]

    Me:
      type: object
      required:
        [id, username, email, role, status, quota_bytes, used_bytes, config_version, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/UserStatus'
        quota_bytes:
          type: integer
          format: int64
          description: Effective quota; -1 means unlimited
        used_bytes:
          type: integer
          format: int64
        config_version:
          type: integer
          description: Version of the effective configuration (ETag of /config/effective)
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time

    DeviceRegistration:
      type: object
      required: [name, platform]
      properties:
        name:
          type: string
          maxLength: 120
          description: Human readable device name (host name by default)
        platform:
          type: string
          enum: [windows, macos, linux, web]
        app_version:
          type: string
          maxLength: 64

    Device:
      type: object
      required: [id, name, platform, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
        app_version:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    EffectiveConfig:
      type: object
      required: [version, config, locked_keys]
      properties:
        version:
          type: integer
        config:
          type: object
          additionalProperties: true
          description: Validated against api/config-profile.schema.json (M4)
        locked_keys:
          type: array
          items:
            type: string
          description: Dotted keys the user cannot override

    Usage:
      type: object
      required: [used_bytes, quota_bytes, level]
      properties:
        used_bytes:
          type: integer
          format: int64
        quota_bytes:
          type: integer
          format: int64
          description: -1 means unlimited
        level:
          type: string
          enum: [ok, warning, critical, full]
          description: 'ok below 80 %, warning from 80 %, critical from 95 %, full at 100 %'

    VaultKind:
      type: string
      enum: [private, shared]

    Vault:
      type: object
      required: [id, owner_id, name, kind, last_seq, total_bytes, file_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/VaultKind'
        last_seq:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
        file_count:
          type: integer
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    VaultList:
      type: object
      required: [items, mounts]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Vault'
        mounts:
          type: array
          description: "Shared mounts of other owners' vaults (empty until M4)"
          items:
            $ref: '#/components/schemas/Vault'

    CreateVault:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: '#/components/schemas/VaultKind'
        key_envelopes:
          type: array
          description: 'Both the passphrase and the recovery envelope: required for private vaults, forbidden for shared ones'
          items:
            $ref: '#/components/schemas/KeyEnvelopeInput'

    UpdateVault:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    KeyEnvelopeKind:
      type: string
      enum: [passphrase, recovery]

    KdfParams:
      type: object
      required: [alg, salt]
      properties:
        alg:
          type: string
          enum: [argon2id, hkdf-sha256]
        t:
          type: integer
        m_kib:
          type: integer
        p:
          type: integer
        salt:
          type: string
          description: Standard base64

    KeyEnvelopeInput:
      type: object
      required: [kind, kdf, wrapped_vmk]
      properties:
        kind:
          $ref: '#/components/schemas/KeyEnvelopeKind'
        kdf:
          $ref: '#/components/schemas/KdfParams'
        wrapped_vmk:
          type: string
          format: byte
          description: 'nonce ‖ AES-256-GCM(KEK, VMK) ‖ tag, standard base64 (60 bytes)'

    KeyEnvelope:
      allOf:
        - $ref: '#/components/schemas/KeyEnvelopeInput'
        - type: object
          required: [created_at]
          properties:
            created_at:
              type: string
              format: date-time

    KeyEnvelopes:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KeyEnvelope'

    TreeEntry:
      type: object
      required: [path, file_id, rev, hash, size, kind]
      properties:
        path:
          type: string
        file_id:
          type: string
          format: uuid
        rev:
          type: integer
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        size:
          type: integer
          format: int64
        kind:
          type: string

    Tree:
      type: object
      required: [items, as_of_seq]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TreeEntry'
        as_of_seq:
          type: integer
          format: int64
          description: 'The changelog position the manifest reflects: continue with changes?since=as_of_seq'

    ChangeOp:
      type: string
      enum: [create, modify, move, delete, restore]

    Change:
      type: object
      required: [seq, file_id, op, path, rev, size, author_id, server_time]
      properties:
        seq:
          type: integer
          format: int64
        file_id:
          type: string
          format: uuid
        op:
          $ref: '#/components/schemas/ChangeOp'
        path:
          type: string
        prev_path:
          type: string
        rev:
          type: integer
        blob_hash:
          type: string
        size:
          type: integer
          format: int64
        author_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        server_time:
          type: string
          format: date-time
        conflict_of:
          type: string
          format: uuid
          description: 'Set on a conflict copy: the file it was derived from'

    Changes:
      type: object
      required: [items, next_seq, has_more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Change'
        next_seq:
          type: integer
          format: int64
        has_more:
          type: boolean

    BlobCheck:
      type: object
      required: [hashes]
      properties:
        hashes:
          type: array
          maxItems: 1000
          items:
            type: string
            pattern: '^[0-9a-f]{64}$'

    BlobCheckResult:
      type: object
      required: [missing]
      properties:
        missing:
          type: array
          items:
            type: string

    CommitOpKind:
      type: string
      enum: [create, modify, move, delete, restore, move_prefix]

    CommitOp:
      type: object
      required: [op_id, op]
      properties:
        op_id:
          type: string
          format: uuid
        op:
          $ref: '#/components/schemas/CommitOpKind'
        file_id:
          type: string
          format: uuid
        path:
          type: string
          maxLength: 1100
        path_key:
          type: string
          maxLength: 128
          description: "Private vaults only: 'hmac1:<hex>' identity of the path, since the server cannot derive it from the opaque token (ADR-0009)"
        base_rev:
          type: integer
          minimum: 0
        blob_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        size:
          type: integer
          format: int64
          minimum: 0
        client_mtime:
          type: string
          format: date-time
        conflict_of:
          type: string
          format: uuid
          description: 'Marks a conflict copy (create only)'
        from:
          type: string
        to:
          type: string

    CommitRequest:
      type: object
      required: [device_id, ops]
      properties:
        device_id:
          type: string
          format: uuid
        ops:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/CommitOp'

    OpResult:
      type: object
      required: [op_id, status]
      properties:
        op_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, conflict, rejected]
        file_id:
          type: string
          format: uuid
        rev:
          type: integer
        seq:
          type: integer
          format: int64
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        current_rev:
          type: integer
        current_hash:
          type: string
        current_seq:
          type: integer
          format: int64

    CommitResponse:
      type: object
      required: [results, last_seq]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/OpResult'
        last_seq:
          type: integer
          format: int64

    Revision:
      type: object
      required: [rev, seq, op, path, size, author_id, server_time]
      properties:
        rev:
          type: integer
        seq:
          type: integer
          format: int64
        op:
          $ref: '#/components/schemas/ChangeOp'
        path:
          type: string
        prev_path:
          type: string
        blob_hash:
          type: string
        size:
          type: integer
          format: int64
        author_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        server_time:
          type: string
          format: date-time
        conflict_of:
          type: string
          format: uuid

    RevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
        next_cursor:
          type: string

    GroupMembership:
      type: object
      required: [id, name, member_role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        member_role:
          type: string
          enum: [member, manager]

    DirectoryUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string

    DirectoryGroup:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string

    ResourceType:
      type: string
      enum: [vault, folder, file]

    SharePermission:
      type: string
      enum: [viewer, editor, manager]

    GrantStatus:
      type: string
      enum: [pending, accepted, declined]

    Grant:
      type: object
      required: [principal_type, principal_id, principal_name, permission, status, created_at]
      properties:
        principal_type:
          type: string
          enum: [user, group]
        principal_id:
          type: string
          format: uuid
        principal_name:
          type: string
        permission:
          $ref: '#/components/schemas/SharePermission'
        status:
          $ref: '#/components/schemas/GrantStatus'
        granted_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    GrantInput:
      type: object
      required: [permission]
      properties:
        permission:
          $ref: '#/components/schemas/SharePermission'

    NewGrant:
      type: object
      required: [principal_type, principal_id, permission]
      properties:
        principal_type:
          type: string
          enum: [user, group]
        principal_id:
          type: string
          format: uuid
        permission:
          $ref: '#/components/schemas/SharePermission'

    Share:
      type: object
      required:
        [id, vault_id, vault_name, resource_type, display_name, owner_id, owner_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        vault_id:
          type: string
          format: uuid
        vault_name:
          type: string
        resource_type:
          $ref: '#/components/schemas/ResourceType'
        path_prefix:
          type: string
          description: Folder shares; only shown to the owner and managers
        file_id:
          type: string
          format: uuid
        display_name:
          type: string
        owner_id:
          type: string
          format: uuid
        owner_name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        my_permission:
          $ref: '#/components/schemas/SharePermission'
        my_status:
          $ref: '#/components/schemas/GrantStatus'
        grants:
          type: array
          description: Only for the owner and managers
          items:
            $ref: '#/components/schemas/Grant'

    CreateShare:
      type: object
      required: [vault_id, resource_type, display_name]
      properties:
        vault_id:
          type: string
          format: uuid
        resource_type:
          $ref: '#/components/schemas/ResourceType'
        path_prefix:
          type: string
        file_id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        expires_at:
          type: string
          format: date-time
        grants:
          type: array
          items:
            $ref: '#/components/schemas/NewGrant'

    UpdateShare:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        expires_at:
          type: string
          format: date-time
        clear_expiry:
          type: boolean
          description: Remove the expiry (instead of setting expires_at)

    Mount:
      type: object
      required: [share_id, vault_id, display_name, resource_type, permission, scope, owner_name]
      properties:
        share_id:
          type: string
          format: uuid
        vault_id:
          type: string
          format: uuid
        display_name:
          type: string
        resource_type:
          $ref: '#/components/schemas/ResourceType'
        permission:
          $ref: '#/components/schemas/SharePermission'
        scope:
          type: string
          description: Value of the `scope` parameter that syncs this mount (`share:{id}`)
        owner_name:
          type: string
        expires_at:
          type: string
          format: date-time

    AdminUser:
      type: object
      required: [id, username, email, role, status, quota_bytes, used_bytes, created_at]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: string}
        display_name: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        status: {$ref: '#/components/schemas/UserStatus'}
        quota_bytes_override:
          type: integer
          format: int64
          nullable: true
          description: null = the global default, -1 = unlimited
        quota_bytes: {type: integer, format: int64, description: 'Effective quota, -1 = unlimited'}
        used_bytes: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        last_login_at: {type: string, format: date-time}
    AdminUserList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminUser'}
        total: {type: integer}
    CreateAdminUser:
      type: object
      required: [username, email]
      properties:
        username: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, format: email}
        display_name: {type: string, maxLength: 200}
        role: {$ref: '#/components/schemas/Role'}
        temporary_password:
          type: string
          minLength: 8
          description: Optional; the user must change it at the first login
    UpdateAdminUser:
      type: object
      properties:
        display_name: {type: string, maxLength: 200}
        email: {type: string, format: email}
    SetRole:
      type: object
      required: [role]
      properties:
        role: {$ref: '#/components/schemas/Role'}
    SetQuota:
      type: object
      properties:
        quota_bytes:
          type: integer
          format: int64
          nullable: true
          minimum: -1
          description: Omitted or null = the global default, -1 = unlimited
    ResetPasswordResult:
      type: object
      required: [email_sent]
      properties:
        email_sent: {type: boolean, description: 'False when Keycloak could not send the e-mail; the new password is still required at the next login'}
    AdminVault:
      type: object
      required: [id, name, kind, total_bytes, file_count, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
