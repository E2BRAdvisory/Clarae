// LEGACY copy of the notification stream (package memobrain.v1), kept so that the desktop
// clients 1.4.0 and earlier, which call /memobrain.v1.NotifyService/Subscribe, keep their
// stream against a cloud of 2.0 or later (ADR-0052, M17 B2). The messages are identical to
// api/proto/clarae/v1/notify.proto, the current contract: change that file first and keep the
// two in step while this one exists. The server registers both services on the same handler
// (services/cloud/internal/grpcserver). The directory stays memobrain/v1 because buf lint
// (STANDARD) ties the directory to the package. Dropped in 3.0.
syntax = "proto3";

package memobrain.v1;

option go_package = "clarae/shared/notifyv1legacy;notifyv1legacy";

service NotifyService {
  // Stream of events for every vault and shared mount accessible to the token.
  // The stream is closed with UNAUTHENTICATED when the token expires; the
  // client refreshes and reconnects, passing the last known seq per vault.
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

message SubscribeRequest {
  string device_id = 1;
  map<string, int64> known_seq = 2; // vault_id -> last seq known by the client (for replay)
  int32 config_version = 3;
}

message Event {
  oneof payload {
    VaultChanged vault_changed = 1;
    ConfigChanged config_changed = 2;
    ShareChanged share_changed = 3;
    AccountChanged account_changed = 4; // suspension, quota change
  }
}

message VaultChanged {
  string vault_id = 1;
  int64 seq = 2;
}

message ConfigChanged {
  int32 version = 1;
}

message ShareChanged {
  string share_id = 1;
  string kind = 2; // granted | revoked | updated
}

message AccountChanged {
  string kind = 1; // suspended | activated | quota_changed
}
