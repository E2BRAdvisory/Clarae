version: '2'

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        # Cloud modular monolith (spec §4.3, ADR-0033): each module owns a
        # generated query package (internal/<module>/<module>db) that no other
        # module imports; the tables each query file reads and writes are
        # checked by services/cloud/internal/db/ownership_test.go.
        admin-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/admin/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/admin/admindb'
              desc: 'tables of the admin module: call the functions it exports (ADR-0033)'
        audit-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/audit/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/audit/auditdb'
              desc: 'tables of the audit module: call the functions it exports (ADR-0033)'
        blobs-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/blobs/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/blobs/blobsdb'
              desc: 'tables of the blobs module: call the functions it exports (ADR-0033)'
        configprofiles-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/configprofiles/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/configprofiles/configprofilesdb'
              desc: 'tables of the configprofiles module: call the functions it exports (ADR-0033)'
        export-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/export/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/export/exportdb'
              desc: 'tables of the export module: call the functions it exports (ADR-0033)'
        groups-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/groups/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/groups/groupsdb'
              desc: 'tables of the groups module: call the functions it exports (ADR-0033)'
        jobs-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/jobs/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/jobs/jobsdb'
              desc: 'tables of the jobs module: call the functions it exports (ADR-0033)'
        notify-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/notify/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/notify/notifydb'
              desc: 'tables of the notify module: call the functions it exports (ADR-0033)'
        privacy-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/privacy/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/privacy/privacydb'
              desc: 'tables of the privacy module: call the functions it exports (ADR-0033)'
        quota-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/quota/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/quota/quotadb'
              desc: 'tables of the quota module: call the functions it exports (ADR-0033)'
        revisions-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/revisions/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/revisions/revisionsdb'
              desc: 'tables of the revisions module: call the functions it exports (ADR-0033)'
        settings-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/settings/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/settings/settingsdb'
              desc: 'tables of the settings module: call the functions it exports (ADR-0033)'
        sharing-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/sharing/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/sharing/sharingdb'
              desc: 'tables of the sharing module: call the functions it exports (ADR-0033)'
        sync-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/sync/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/sync/syncdb'
              desc: 'tables of the sync module: call the functions it exports (ADR-0033)'
        users-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/users/**'
          deny:
            - pkg: 'clarae/services/cloud/internal/users/usersdb'
              desc: 'tables of the users module: call the functions it exports (ADR-0033)'
        vaults-db:
          files:
            - '**/services/cloud/**'
            - '!**/services/cloud/internal/vaults/**'
            - '!**/services/cloud/internal/access/**' # access.Vault aliases the row type (ADR-0033)
          deny:
            - pkg: 'clarae/services/cloud/internal/vaults/vaultsdb'
              desc: 'tables of the vaults module: call the functions it exports (ADR-0033)'
        main:
          files:
            - '$all'
          deny:
            - pkg: 'github.com/pkg/errors'
              desc: 'use the standard errors package and fmt.Errorf with %w'
    gosec:
      excludes:
        - G304 # file inclusion via variable: vault FS access is validated by pathrules
        - G703 # path traversal by taint analysis: same rationale, every vault path goes through vault.FS.Resolve
        - G122 # walk-callback TOCTOU: only unlinks our own staging files (a symlink is unlinked, never followed)
        - G301 # directory permissions: vault folders are ordinary user folders (0755)
        - G302 # chmod of atomic-write temporaries to 0644: same rationale
        - G306 # file permissions: notes are ordinary user files (0644), as in Obsidian
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    paths:
      - ".*\\.gen\\.go$"
      - 'internal/api/.*'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - clarae
