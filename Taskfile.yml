# MemoBrain Notes monorepo entry points. Run `task` (or `task --list`) for the list.
# Variables are passed as `task <name> VAR=value` (or as environment variables);
# extra script arguments go after `--`.
version: '3'

vars:
  GO_MODULES: shared/go services/cloud apps/desktop
  CLOUD: services/cloud
  WEB_DIR: web
  WEBEMBED: '{{.CLOUD}}/web-embed'
  DESKTOP: apps/desktop
  COMPOSE: docker compose -f deploy/docker/compose.dev.yaml
  # Wails v3 CLI (installed by `task wails-cli`, pinned to apps/desktop/go.mod; ADR-0051). It is not used to build:
  # scripts/build-desktop-bin.sh runs `go build`. It provides the dev watcher and the Windows resources.
  WAILS: wails3
  # On Linux the webview binding is GTK3 + WebKit2GTK 4.1: the build tag gtk3 (the default would be GTK4). Every Go
  # tool that compiles apps/desktop needs it there (vet, tests, golangci-lint, govulncheck); empty elsewhere.
  WAILS_TAGS:
    sh: '[ "$(uname -s)" = Linux ] && echo gtk3 || true'
  GO_TAGS_FLAG: '{{if .WAILS_TAGS}}-tags {{.WAILS_TAGS}}{{end}}'
  VERSION:
    sh: echo "${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo dev)}"
  WASM_OUT: '{{.WASM_OUT | default "build/wasm"}}'
  IMAGE: '{{.IMAGE | default "ghcr.io/e2br/memobrain-cloud"}}'
  PLATFORMS: '{{.PLATFORMS | default "linux/amd64,linux/arm64"}}'
  PERF_NOTES: '{{.PERF_NOTES | default "50000"}}'
  PERF_DIR: '{{.PERF_DIR | default (print .ROOT_DIR "/.perf")}}'
  PERF_OUT: '{{.PERF_OUT | default (print .PERF_DIR "/results-" .PERF_NOTES ".json")}}'
  PERF_TOLERANCE: '{{.PERF_TOLERANCE | default "25"}}'

tasks:
  default:
    desc: Show this help
    silent: true
    cmds:
      - '{{.TASK_EXE}} --list'

  ## ---- tooling ---------------------------------------------------------------

  tools:
    desc: Install pinned developer tools from tools/go.mod (into GOBIN, task included) and JS deps
    cmds:
      - cd tools && GOWORK=off go install tool
      - yarn install --immutable

  ## ---- code generation -------------------------------------------------------

  wails-cli:
    desc: Install the Wails v3 CLI (wails3) at the library version of apps/desktop/go.mod, built with the repo's Go
    cmds:
      - scripts/install-wails.sh

  gen:
    desc: Regenerate all generated code
    cmds:
      - task: gen-features
      - task: gen-openapi
      - task: gen-proto
      - task: gen-sqlc
      - task: gen-wails
      - task: gen-events
      - task: gen-capabilities
      - task: gen-parity-features

  gen-features:
    desc: Config Profile schema -> Go flags and defaults (shared/go/features), TS flags (@memobrain/api-client/features)
    dir: shared/go
    cmds:
      - go run ./features/gen

  gen-openapi:
    desc: OpenAPI -> Go server stubs, Go client (shared/go/apiclient) + TS client
    preconditions:
      - sh: test -f api/openapi.yaml
        msg: api/openapi.yaml missing (M0-WP2)
    cmds:
      - cd {{.CLOUD}} && oapi-codegen -config ../../api/oapi-codegen.yaml ../../api/openapi.yaml
      - cd shared/go && oapi-codegen -config ../../api/oapi-codegen-client.yaml ../../api/openapi.yaml
      - cmd: if [ -d packages/api-client ]; then yarn workspace @memobrain/api-client run gen; fi
        silent: true

  gen-proto:
    desc: protobuf -> Go (buf)
    dir: api/proto
    preconditions:
      - sh: test -f buf.yaml
        msg: api/proto/buf.yaml missing (M0-WP2)
    cmds:
      - buf generate

  gen-sqlc:
    desc: SQL queries -> typed Go (sqlc)
    dir: '{{.CLOUD}}'
    preconditions:
      - sh: test -f sqlc.yaml
        msg: '{{.CLOUD}}/sqlc.yaml missing (M0-WP3)'
    cmds:
      - sqlc generate

  # The bindings themselves are not committed (packages/workbench/wailsjs); the typed client of the browser
  # host derived from them is (web/src/workbench/core.gen.ts, ADR-0045 §5), so `task check-gen` sees it drift.
  # The tree is written by a Go program that reflects App.Services (ADR-0051, B-D3): the same files `wails generate
  # module` wrote, no Wails CLI and no frontend build needed.
  gen-wails:
    desc: Go bindings (App.Services) -> packages/workbench/wailsjs, and the browser host's typed client (web/src/workbench/core.gen.ts)
    cmds:
      - cd {{.DESKTOP}} && go run ./internal/app/gen/bindings
      - node scripts/gen-core-client.mjs

  gen-events:
    desc: Go event registry (apps/desktop/internal/app/events_registry.go) -> packages/workbench/src/app/events.gen.ts
    dir: '{{.DESKTOP}}'
    cmds:
      - go run ./internal/app/gen/events

  gen-capabilities:
    desc: Capabilities of the host declared by the Go core (apps/desktop/internal/app/capabilities.go) -> packages/workbench/src/platform/capabilities.gen.ts, shared/parity/capabilities.gen.json
    dir: '{{.DESKTOP}}'
    cmds:
      - go run ./internal/app/gen/capabilities

  gen-parity-features:
    desc: Feature ids of the registry (shared/parity/features.yaml) -> FeatureId (packages/workbench/src/parity/features.gen.ts) and Go constants (shared/go/parity/features_gen.go), ADR-0045 §3
    cmds:
      - node scripts/gen-feature-ids.mjs

  # The UI is typed against the generated bindings, which the repository does not hold: build them when they are
  # missing (a stale copy is refreshed by `task gen-wails`, or `task gen`).
  wailsjs:
    desc: Generate the Wails bindings only if packages/workbench/wailsjs is missing
    status:
      - test -f packages/workbench/wailsjs/go/models.ts
    cmds:
      - task: gen-wails

  ## ---- quality ---------------------------------------------------------------

  lint:
    desc: Lint everything
    cmds:
      - task: lint-wails-versions
      - task: lint-go
      - task: lint-ts

  # apps/desktop/main.go embeds the frontend build (go:embed all:frontend/dist): a placeholder lets every Go task
  # that compiles it (lint, vulncheck, tests) run on a clean checkout, before any frontend build.
  frontend-placeholder:
    internal: true
    silent: true
    cmds:
      - mkdir -p {{.DESKTOP}}/frontend/dist
      - '[ -e {{.DESKTOP}}/frontend/dist/index.html ] || touch {{.DESKTOP}}/frontend/dist/index.html'

  # Wails v3 is written in three places that must be the same release: apps/desktop/go.mod (the source), the exact pin of
  # @wailsio/runtime in apps/desktop/frontend/package.json and the wails3 CLI, when one is installed (ADR-0051).
  lint-wails-versions:
    desc: The Wails version of go.mod, of the npm runtime and of the wails3 CLI (when installed) must match
    silent: true
    cmds:
      - scripts/install-wails.sh --check-pins

  lint-go:
    desc: golangci-lint on all Go modules
    silent: true
    deps: [frontend-placeholder]
    cmds:
      - for m in {{.GO_MODULES}}; do echo "==> $m"; (cd $m && golangci-lint run {{if .WAILS_TAGS}}--build-tags {{.WAILS_TAGS}} {{end}}./...) || exit 1; done

  lint-ts:
    desc: ESLint + Prettier
    cmds:
      - yarn run lint

  vuln:
    desc: govulncheck on all Go modules
    silent: true
    deps: [frontend-placeholder]
    cmds:
      - for m in {{.GO_MODULES}}; do echo "==> $m"; (cd $m && govulncheck {{.GO_TAGS_FLAG}} ./...) || exit 1; done

  test:
    desc: Unit tests (Go + TS) and conformance suite
    cmds:
      - task: test-go
      - task: test-ts
      - task: conformance

  test-go:
    desc: go test -race on all Go modules
    silent: true
    deps: [frontend-placeholder]
    env:
      # Set by `task ci`: the dispatcher/bindings test fails instead of skipping when wailsjs is missing.
      MEMOBRAIN_REQUIRE_BINDINGS: '{{.REQUIRE_BINDINGS | default ""}}'
    cmds:
      - for m in {{.GO_MODULES}}; do echo "==> $m"; (cd $m && go test -race -count=1 {{.GO_TAGS_FLAG}} ./...) || exit 1; done

  wasm-core:
    desc: The desktop core as WebAssembly (apps/desktop/cmd/memobrain-core) + wasm_exec.js (ADR-0030)
    cmds:
      - mkdir -p {{.WASM_OUT}}
      - cd apps/desktop && GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w -X main.Version={{.VERSION}}" -o {{.ROOT_DIR}}/{{.WASM_OUT}}/memobrain-core.wasm ./cmd/memobrain-core
      - install -m 0644 "$(go env GOROOT)/lib/wasm/wasm_exec.js" {{.WASM_OUT}}/wasm_exec.js

  test-wasm:
    desc: Desktop Go core tests as WebAssembly under Node, with the sqlite-wasm bridge (ADR-0030)
    dir: apps/desktop
    cmds:
      - GOOS=js GOARCH=wasm go test -count=1 -exec "{{.ROOT_DIR}}/scripts/go-js-exec.sh" ./internal/... ./cmd/...

  test-core:
    desc: 'The cloud panels on the Go core compiled to WebAssembly, in Node, against a fake cloud checked by api/openapi.yaml (ADR-0045 §7)'
    deps: [wasm-core, wailsjs]
    cmds:
      - yarn workspace @memobrain/workbench run test:core

  test-ts:
    desc: Vitest in every workspace package
    cmds:
      - yarn run test

  test-integration:
    desc: 'Cloud integration tests (testcontainers: PG, MinIO, Keycloak)'
    dir: '{{.CLOUD}}'
    cmds:
      - go test -race -count=1 -tags integration ./test/...

  conformance:
    desc: Shared Markdown/merge/crypto fixtures run by Go and TS
    cmds:
      - cd shared/go && go test -race -count=1 -run Conformance ./conformance/... ./merge/...
      - cmd: if [ -d {{.DESKTOP}}/internal/parser ]; then cd {{.DESKTOP}} && go test -race -count=1 -run Conformance ./internal/parser/...; fi
        silent: true
      - yarn workspace @memobrain/conformance run test
      - yarn workspace @memobrain/markdown run test
      - cmd: if [ -f packages/workbench/src/test/conformance.test.ts ]; then yarn workspace @memobrain/workbench exec vitest run src/test/conformance.test.ts; fi
        silent: true

  test-desktop-e2e:
    desc: Two-device sync e2e (builds the cloud binary, PG via testcontainers)
    dir: '{{.DESKTOP}}'
    cmds:
      - go test -race -count=1 -tags integration ./internal/sync/...

  test-load:
    desc: k6 load test (needs a running `task dev-cloud`; see services/cloud/test/load/README.md)
    cmds:
      - k6 run {{.CLOUD}}/test/load/sync.k6.js

  e2e:
    desc: Playwright (Chromium) for the desktop UI and the Web UI
    cmds:
      - task: e2e-desktop
      - task: e2e-desktop-prod
      - task: e2e-web

  e2e-desktop:
    desc: Desktop UI against the in-memory Wails mock
    cmds:
      - yarn workspace @memobrain/desktop-frontend run e2e

  e2e-desktop-prod:
    desc: Drawing/graph/canvas specs on the minified production bundle (ADR-0025)
    cmds:
      - yarn workspace @memobrain/desktop-frontend run e2e:prod

  e2e-web:
    desc: Web UI on the esbuild dev server with the API mocked (OIDC test double)
    cmds:
      - yarn workspace @memobrain/web run e2e

  e2e-matrix:
    desc: The desktop UI specs on both targets, desktop-mock and web-core (web/playwright.workbench-ui.config.ts)
    deps: [wasm-core]
    cmds:
      - yarn workspace @memobrain/web run e2e:workbench-ui {{.CLI_ARGS}}

  e2e-mixed:
    desc: 'Mixed clients on one cloud: headless desktop device + web workbench, on a throwaway stack (scripts/e2e-mixed.sh; args: all|up|build|cloud|test|down)'
    cmds:
      - scripts/e2e-mixed.sh {{.CLI_ARGS}}

  typecheck:
    desc: TypeScript type check in every workspace package
    deps: [wailsjs]
    cmds:
      - yarn run typecheck

  parity:
    desc: Check the feature registry (shared/parity/features.yaml) and docs/web-workbench-parity.md (ADR-0029, ADR-0037)
    deps: [wailsjs]
    cmds:
      - node --test 'scripts/parity/*.test.mjs'
      - node scripts/parity.mjs --check

  check-gen:
    desc: Fail when `task gen` changes the tree (generated code out of date)
    silent: true
    cmds:
      - |
        state() { { git diff --no-ext-diff; git ls-files --others --exclude-standard | sort | xargs -I{} shasum {} ; } | shasum; }
        before=$(state)
        {{.TASK_EXE}} gen
        if [ "$(state)" != "$before" ]; then
          echo "generated code is out of date: run 'task gen' and review the diff" >&2
          git status --short >&2
          exit 1
        fi

  # There is no CI service (ADR-0036): this is the verification to run locally before merging and before tagging
  # a release. Slower suites that need Docker or browsers are listed in docs/dev-setup.md (test-integration,
  # test-desktop-e2e, e2e, `yarn workspace @memobrain/web e2e:cloud`).
  ci:
    desc: Full local verification before merging or tagging (ADR-0036)
    cmds:
      - task: lint
      - task: typecheck
      - task: vuln
      - task: wailsjs
      - task: test-go
        vars: { REQUIRE_BINDINGS: '1' }
      - task: test-ts
      - task: conformance
      - task: test-wasm
      - task: test-core
      - task: parity
      - task: check-gen

  ## ---- run -------------------------------------------------------------------

  stack-up:
    desc: Start PostgreSQL, MinIO and Keycloak for development
    cmds:
      - '{{.COMPOSE}} up -d --wait'

  stack-down:
    desc: Stop the development stack (keeps volumes)
    cmds:
      - '{{.COMPOSE}} down'

  stack-logs:
    desc: Tail the development stack logs
    cmds:
      - '{{.COMPOSE}} logs -f'

  stack-reset:
    desc: Destroy the stack volumes (re-imports the Keycloak realm, empties PG and S3) and start again
    cmds:
      - '{{.COMPOSE}} down -v'
      - '{{.COMPOSE}} up -d --wait'

  dev-cloud:
    desc: Run the cloud service against the local stack (role=all) with the Web UI on :5174 (WEB=0 to skip)
    silent: true
    env:
      WEB: '{{.WEB | default "1"}}'
    cmds:
      - bash -c '. scripts/lib.sh; if [ "${WEB:-1}" != 0 ]; then trap web_stop EXIT; web_start; fi; cd {{.CLOUD}} && set -a && . ../../deploy/docker/cloud.dev.env && set +a && go run ./cmd/memobrain-cloud --role=all'

  # `wails3 dev` is not used: it forces `localhost` and a port of its own, while our esbuild server (ADR-0025) listens on
  # 127.0.0.1:5173. The watcher (build/config.yml) starts that server, rebuilds the Go binary on every .go change and
  # restarts it; the app proxies the UI from FRONTEND_DEVSERVER_URL.
  dev-desktop:
    desc: Run the desktop app with live reload (esbuild server on 127.0.0.1:5173, Go rebuilt on change)
    dir: '{{.DESKTOP}}'
    preconditions:
      - sh: '{{.ROOT_DIR}}/scripts/install-wails.sh --check'
        msg: The Wails CLI (wails3) must match the library version in apps/desktop/go.mod (run `task wails-cli`)
    env:
      FRONTEND_DEVSERVER_URL: http://127.0.0.1:5173
    cmds:
      - '{{.WAILS}} tool watcher -config build/config.yml'

  dev-web:
    desc: Web UI on :5174 with live reload, proxying /api to the cloud on :18081
    cmds:
      - yarn workspace @memobrain/web run dev

  run-desktop:
    desc: 'Desktop standalone (no cloud) with a demo vault: scripts/run-desktop.sh --demo'
    cmds:
      - scripts/run-desktop.sh --demo

  run-desktop-cloud:
    desc: 'Desktop + Docker stack + cloud service: scripts/run-desktop-with-cloud.sh --demo'
    cmds:
      - scripts/run-desktop-with-cloud.sh --demo

  run-desktop-2devices:
    desc: Two desktop instances against the cloud (simulates two devices)
    cmds:
      - scripts/run-desktop-with-cloud.sh --two-devices --demo

  dev-stop:
    desc: 'Stop the cloud process started by the run scripts (add -- --stack or -- --purge)'
    cmds:
      - scripts/dev-stop.sh {{.ARGS}} {{.CLI_ARGS}}

  ## ---- build -----------------------------------------------------------------

  # The Web UI of a release is the default build: no MEMOBRAIN_LIVE_ENGINE / _AI / _COLLAB / _E2E / _DIST in the environment
  # (check-editor-switches.sh, first, before the slow steps) and no Milkdown or binding mock in web/dist (check-dist.sh, last, before the
  # copy). The cloud image does the same in services/cloud/Dockerfile. A web build with a switch on is made by calling
  # `yarn workspace @memobrain/web run build` directly (e2e, docs/dev-setup.md).
  web-build:
    desc: Build the Web UI (with the WebAssembly core) and copy it into the cloud binary's embed dir (then run build-cloud)
    cmds:
      - sh scripts/release/check-editor-switches.sh
      - task: wasm-core
      - task: wailsjs
      - MEMOBRAIN_VERSION={{.VERSION}} yarn workspace @memobrain/web run build
      - sh scripts/release/check-dist.sh {{.WEB_DIR}}/dist
      - rm -rf {{.WEBEMBED}}/dist && mkdir -p {{.WEBEMBED}}/dist
      - cp -R {{.WEB_DIR}}/dist/. {{.WEBEMBED}}/dist/

  web-clean:
    desc: Drop the embedded Web UI build and restore the tracked placeholder index.html
    cmds:
      - rm -rf {{.WEBEMBED}}/dist && mkdir -p {{.WEBEMBED}}/dist
      - git checkout -- {{.WEBEMBED}}/dist/index.html

  build-cloud:
    desc: 'Build the cloud binary into bin/ (embeds whatever is in web-embed/dist: run web-build first)'
    dir: '{{.CLOUD}}'
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.Version={{.VERSION}}" -o ../../bin/memobrain-cloud ./cmd/memobrain-cloud

  # Frontend build, then `go build -tags production[,gtk3]` into apps/desktop/build/bin (macOS: universal .app).
  build-desktop:
    desc: Build the desktop app for the current OS (scripts/build-desktop-bin.sh)
    preconditions:
      - sh: '{{.ROOT_DIR}}/scripts/install-wails.sh --check-pins'
        msg: Wails library, npm runtime and CLI must have the same version (see scripts/install-wails.sh)
    cmds:
      - scripts/build-desktop-bin.sh --version {{.VERSION}}

  docker-build:
    desc: Build the cloud image (Web UI + workbench embedded) for this machine and load it as IMAGE:VERSION
    cmds:
      - docker build -f services/cloud/Dockerfile --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}:{{.VERSION}} .

  docker-push:
    desc: Build and push the multi-arch cloud image (PLATFORMS); needs `docker login` and a buildx builder
    cmds:
      - docker buildx build -f services/cloud/Dockerfile --platform {{.PLATFORMS}} --build-arg VERSION={{.VERSION}} -t {{.IMAGE}}:{{.VERSION}} --push .

  ## ---- release / distribution (M7-WP3, docs/release/README.md) --------------

  release-tool:
    desc: Build tools/release (gen-manifest, sign-manifest, verify-manifest) into bin/release
    dir: tools/release
    cmds:
      - GOWORK=off go build -o ../../bin/release .

  helm-check:
    desc: helm lint + template for the chart with every values file, on Kubernetes 1.27 (oldest supported) and 1.30
    dir: deploy/helm/memobrain
    silent: true
    cmds:
      # The defaults hold no secret: the chart must refuse to create an empty Secret.
      - if helm template ci . >/dev/null 2>&1; then echo "the default values rendered a Secret without values" >&2; exit 1; fi; echo "ok defaults refused (no secret)"
      - |
        for kv in 1.27.0 1.30.0; do
          for f in values-k3d.yaml values-k3d.yaml,values-chaos.yaml ci/*.yaml; do
            args=""; for v in $(echo "$f" | tr , ' '); do args="$args -f $v"; done
            helm lint . --kube-version "$kv" $args >/dev/null && helm template ci . --kube-version "$kv" $args >/dev/null || exit 1
            echo "ok k8s $kv $f"
          done
        done
      # The preStop sleep action exists from Kubernetes 1.30 only.
      - if helm template ci . -f ci/values-ha.yaml --kube-version 1.27.0 | grep -q 'sleep:'; then echo "preStop sleep rendered for Kubernetes 1.27" >&2; exit 1; fi
      - if ! helm template ci . -f ci/values-ha.yaml --kube-version 1.30.0 | grep -q 'sleep:'; then echo "preStop sleep missing for Kubernetes 1.30" >&2; exit 1; fi; echo "ok preStop sleep only on 1.30+"

  release-desktop:
    desc: 'Installer build, release guards on (needs UPDATE_PUBLIC_KEY + UPDATE_BASE_URL, or ALLOW_UNSIGNED_UPDATES=1): task release-desktop OS=darwin|windows|linux V=1.0.0-rc.1'
    requires:
      vars: [OS, V]
    cmds:
      # --release: no build switch or MEMOBRAIN_DIST in the environment, no Milkdown and no binding mock in the built UI
      # (check-editor-switches.sh, check-dist.sh), no development update key. What it builds is what is shipped.
      - bash scripts/release/build-desktop.sh {{.OS}} {{.V}} --release

  ## ---- maintenance -----------------------------------------------------------

  rename-module:
    desc: 'Rename the Go module path placeholder: task rename-module NEW=github.com/org/memobrain'
    silent: true
    requires:
      vars: [NEW]
    cmds:
      - |
        git ls-files -z -- '*.go' 'go.mod' 'go.work' '*.yaml' '*.yml' '*.md' 'Taskfile.yml' \
          | xargs -0 perl -pi -e 's{(?<![\w./-])memobrain/(apps|services|shared)\b}{{"{"}}{{.NEW}}/$1{{"}"}}g'
      - 'echo "Module paths renamed to {{.NEW}}/...; run: go work sync && task gen"'

  ## ---- performance (M7-WP1; see docs/perf/README.md) ------------------------

  perf-data:
    desc: 'Generate the synthetic vault (cached): task perf-data PERF_NOTES=50000'
    dir: '{{.DESKTOP}}'
    cmds:
      - go run ./internal/perf/cmd/perfdata -notes {{.PERF_NOTES}} -dir {{.PERF_DIR}}/vault-{{.PERF_NOTES}}

  perf:
    desc: 'Desktop perf suite (index, search, note open, vault open, graph 10k): task perf PERF_NOTES=50000'
    cmds:
      - cmd: mkdir -p {{.PERF_DIR}}
        silent: true
      - >-
        cd {{.DESKTOP}} && MEMOBRAIN_PERF_NOTES={{.PERF_NOTES}} MEMOBRAIN_PERF_DIR={{.PERF_DIR}} MEMOBRAIN_PERF_OUT={{.PERF_OUT}}
        go test -run TestPerf -count=1 -timeout 90m -v ./internal/perf/

  perf-check:
    desc: 'Fail on regressions vs the stored baseline: task perf-check PERF_NOTES=50000 [PERF_TOLERANCE=25]'
    dir: '{{.DESKTOP}}'
    cmds:
      - >-
        go run ./internal/perf/cmd/perfcheck -baseline ../../docs/perf/baseline-{{.PERF_NOTES}}.json
        -results {{.PERF_OUT}} -tolerance {{.PERF_TOLERANCE}}

  perf-load-env:
    desc: 'Cloud load env for k6 (needs Docker): task perf-load-env USERS=1000, then k6 run -e TOKENS=.perf/tokens.json services/cloud/test/load/k6/active-users.js'
    cmds:
      - cmd: mkdir -p {{.PERF_DIR}}
        silent: true
      - >-
        cd {{.CLOUD}} && MEMOBRAIN_LOADENV_USERS={{.USERS | default "1000"}} MEMOBRAIN_LOADENV_OUT={{.PERF_DIR}}/tokens.json
        go test -tags integration -run TestServeLoadEnv -count=1 -timeout 2h -v ./test/integration/
