# Registro delle funzioni (ADR-0037 §1): una voce per funzione utente, con ciò che la realizza su
# desktop, nel workbench web e nella console web. È l'unica fonte della parità:
# `node scripts/parity.mjs --check` (in `task parity` e `task ci`) fallisce se un comando, un
# binding o un'operazione OpenAPI non compare in nessuna voce, se una voce rimanda a qualcosa che
# non esiste o se uno stato diverso da `yes` non ha motivazione. Schema: features.schema.json.
# Come aggiungere una voce: docs/dev-setup.md, "Registro delle funzioni".
#
# Stati: yes | partial | exception (eccezione dichiarata, ADR-0029) | console-only (solo
# desktop/workbench: la funzione sta nella console) | missing. `reason` è obbligatoria se lo stato
# non è `yes`; `note` aggiunge un'informazione anche quando lo stato è `yes`.
# Il workbench eredita commands, actions, bindings, operationIds e capability del desktop se non li
# elenca (stessa UI e stesso core, ADR-0029). `actions` elenca le azioni dichiarative dei pannelli
# (defineAction in packages/workbench/src/commands/actions.ts, ADR-0045 §2), controllate come i
# comandi; ogni comando e ogni azione dichiara la sua funzione (`feature`, tipo FeatureId generato da
# questo file con `task gen`), che deve essere una delle voci che lo elencano. `console` si omette per le funzioni sul contenuto di un
# vault aperto, che la console affida al workbench (rotta /vaults/:id/open). `console.actions` cita
# le azioni della console che non chiamano la REST (attributo data-action in web/src).
# I test sono file relativi alla radice, divisi per superficie (ADR-0045 §4): desktop = UI
# (packages/workbench), e2e sul mock (apps/desktop/frontend/e2e) e core Go; workbench = host web
# (web/src/workbench), spec nel browser (web/e2e*), spec della matrice e2e
# (apps/desktop/frontend/e2e, che girano anche sul core WebAssembly) e test della UI sul core
# WebAssembly in Node (`*.core.test.tsx` di packages/workbench, `task test-core`); console = web/src, web/e2e e
# l'adattatore REST di packages/cloud-features; cloud = services/cloud.
# Workbench `yes` vuole in tests.workbench almeno una prova sul core WebAssembly: uno spec del
# browser che apre il workbench, uno spec della matrice che sul web gira per quella funzione (non
# escluso da un skipOnWeb che la nomina), web/e2e-cloud, web/e2e-mixed o un `*.core.test.tsx`. Senza prova lo stato è
# `partial` con la motivazione «non verificata sul web: …», che il controllo rifiuta quando la
# prova arriva. Ogni rotta, operazione chiamata e azione della console è citata da una voce.
version: 1

features:
  # ---- vault -------------------------------------------------------------------------------------
  - id: vault.local-folder
    title: Vault su una cartella del computer
    desktop:
      status: yes
      capability: localFolders
      actions: [vault:open-folder]
      bindings: [VaultAPI.PickFolder]
    workbench:
      status: exception
      reason: si aprono vault del cloud, copiati nel browser (OPFS); il browser non apre una cartella del computer come vault
    tests:
      desktop:
        - packages/workbench/src/platform/platform.test.tsx
        - apps/desktop/internal/vault/fs_test.go

  - id: vault.open
    title: Apertura, cambio e chiusura del vault
    desktop:
      status: yes
      commands: [vault:close]
      bindings: [VaultAPI.OpenVault, VaultAPI.CloseVault, VaultAPI.ListRecent]
    workbench:
      status: yes
      note: il vault si apre dalla console («Apri», rotta /vaults/:id/open)
    console:
      status: yes
      routes: [/vaults, /vaults/:id/open]
    tests:
      desktop:
        - packages/workbench/src/shell/VaultSwitcher.test.tsx
        - packages/workbench/src/app/teardown.test.tsx
      workbench:
        - web/e2e/workbench.spec.ts
        - web/src/workbench/guard.test.ts
      console:
        - web/src/pages/Vaults.test.tsx

  - id: vault.multi-open
    title: Più vault aperti insieme, vault recenti e cambio dal menu del vault
    desktop:
      status: yes
      commands: [vault:switch]
      bindings: [VaultAPI.ListOpen]
      capability: multiVault
    workbench:
      status: exception
      reason: un vault per pagina, scelto nella console (gli handle sincroni di OPFS sono esclusivi); niente recenti né `vault:switch`
    tests:
      desktop:
        - packages/workbench/src/shell/VaultSwitcher.test.tsx
        - packages/workbench/src/platform/platform.test.tsx
      workbench:
        - web/e2e/workbench.spec.ts

  - id: vault.list
    title: Elenco dei vault cloud
    desktop:
      status: yes
      note: Impostazioni → Cloud, `CloudVaultsTable` di @memobrain/cloud-features (ADR-0037 §2)
      bindings: [SyncAPI.ListCloudVaults]
      operationIds: [listVaults, getVault]
    workbench:
      status: yes
    console:
      status: yes
      note: '`CloudVaultsTable` con `RestCloudPort`; le condivisioni accettate si aprono come mount (`?share=`)'
      routes: [/vaults]
      operationIds: [listVaults]
    notes: una sola UI (@memobrain/cloud-features) su due adattatori, binding e REST (ADR-0037 §2)
    tests:
      desktop:
        - packages/workbench/src/sync/sync.test.tsx
        - packages/workbench/src/cloud/CoreCloudPort.test.tsx
        - apps/desktop/frontend/e2e/cloud-vaults.spec.ts
      workbench:
        - packages/workbench/src/cloud/CoreCloudPort.core.test.tsx
        - apps/desktop/frontend/e2e/cloud-vaults.spec.ts
      console:
        - packages/cloud-features/src/rest.test.tsx
        - web/src/pages/Vaults.test.tsx
      cloud:
        - services/cloud/internal/vaults/service_test.go
        - services/cloud/test/integration/api_test.go

  - id: vault.create
    title: Creazione di un vault cloud
    desktop:
      status: yes
      note: dalla procedura di collegamento di un vault locale («Collega al cloud»), che anche «Nuovo vault» di Impostazioni → Cloud apre
      commands: [sync:connect]
      actions: [cloud-vault:new]
      bindings: [SyncAPI.LinkNew]
      operationIds: [createVault, putKeyEnvelope]
    workbench:
      status: yes
      note: solo vault privati, sulla rotta di creazione /vaults/new/open?kind=private&name=… aperta dalla console; la procedura guidata del workbench chiede la passphrase e mostra la chiave di recupero (la crittografia resta nel core Go)
      commands: []
      actions: []
      bindings: [SyncAPI.LinkNew]
      operationIds: [createVault]
    console:
      status: yes
      note: «Nuovo vault»; un vault condiviso con la REST, uno privato aprendo il workbench sulla rotta di creazione
      routes: [/vaults, /vaults/:id/open]
      operationIds: [createVault]
    tests:
      desktop:
        - packages/workbench/src/sync/sync.test.tsx
        - packages/workbench/src/cloud/CoreCloudPort.test.tsx
        - apps/desktop/internal/sync/manager_test.go
      workbench:
        - web/src/workbench/create.test.ts
        - web/e2e-cloud/web-create-private.spec.ts
      console:
        - packages/cloud-features/src/rest.test.tsx
        - web/src/pages/Vaults.test.tsx
        - web/e2e/vaults.spec.ts
      cloud:
        - services/cloud/internal/vaults/service_test.go
        - services/cloud/web-embed/workbench_test.go

  - id: vault.rename
    title: Rinomina di un vault cloud
    desktop:
      status: yes
      note: Impostazioni → Cloud; un vault locale collegato mostra il nuovo nome nel collegamento, le cartelle non cambiano nome
      bindings: [SyncAPI.RenameCloudVault]
      operationIds: [updateVault]
    workbench:
      status: yes
    console:
      status: yes
      routes: [/vaults]
      operationIds: [updateVault]
    tests:
      desktop:
        - packages/workbench/src/cloud/CoreCloudPort.test.tsx
        - apps/desktop/internal/sync/manager_vaults_test.go
        - apps/desktop/internal/sync/e2e_vaults_test.go
        - apps/desktop/frontend/e2e/cloud-vaults.spec.ts
      workbench:
        - packages/workbench/src/cloud/CoreCloudPort.core.test.tsx
        - apps/desktop/frontend/e2e/cloud-vaults.spec.ts
      console:
        - packages/cloud-features/src/rest.test.tsx
        - web/e2e/vaults.spec.ts
      cloud:
        - services/cloud/internal/vaults/service_test.go

  - id: vault.delete
    title: Eliminazione logica di un vault cloud
    desktop:
      status: yes
      note: dopo l'eliminazione sul server il vault locale collegato si scollega e conserva i file (D-04); se il vault è eliminato dalla console o da un altro dispositivo un avviso lo dice (evento vault:cloud-deleted) e Impostazioni › Sync lo ricorda
      bindings: [SyncAPI.DeleteCloudVault]
      operationIds: [deleteVault]
    workbench:
      status: yes
      note: il vault aperto nella pagina non si elimina da lì (si torna alla console); se è eliminato altrove la copia nel browser è segnata nel marcatore e l'avviso offre di rimuoverla (le modifiche mai caricate si elencano prima)
    console:
      status: yes
      routes: [/vaults]
      operationIds: [deleteVault]
    tests:
      desktop:
        - packages/workbench/src/cloud/CoreCloudPort.test.tsx
        - packages/workbench/src/app/App.test.tsx
        - packages/workbench/src/sync/sync.test.tsx
        - apps/desktop/internal/sync/manager_vaults_test.go
        - apps/desktop/internal/sync/manager_mounts_test.go
        - apps/desktop/internal/sync/e2e_vaults_test.go
        - apps/desktop/frontend/e2e/cloud-vaults.spec.ts
      workbench:
        - packages/workbench/src/cloud/CoreCloudPort.core.test.tsx
        - web/src/workbench/guard.test.ts
        - apps/desktop/frontend/e2e/cloud-vaults.spec.ts
      console:
        - packages/cloud-features/src/rest.test.tsx
        - web/src/pages/Vaults.test.tsx
        - web/e2e/vaults.spec.ts
      cloud:
        - services/cloud/internal/vaults/service_test.go

  - id: vault.restore
    title: Ripristino di un vault cloud eliminato
    desktop:
      status: yes
      note: sezione «Vault eliminati»; il vault ripristinato non si ricollega da solo
      bindings: [SyncAPI.ListDeletedCloudVaults, SyncAPI.RestoreCloudVault]
      operationIds: [listVaults, restoreVault]
    workbench:
      status: yes
    console:
      status: yes
      note: la data di rimozione definitiva compare solo se il client conosce la conservazione (l'API non la espone)
      routes: [/vaults]
      operationIds: [listVaults, restoreVault]
    tests:
      desktop:
        - packages/workbench/src/cloud/CoreCloudPort.test.tsx
        - apps/desktop/internal/sync/manager_vaults_test.go
        - apps/desktop/internal/sync/e2e_vaults_test.go
        - apps/desktop/frontend/e2e/cloud-vaults.spec.ts
      workbench:
        - packages/workbench/src/cloud/CoreCloudPort.core.test.tsx
        - apps/desktop/frontend/e2e/cloud-vaults.spec.ts
      console:
        - packages/cloud-features/src/rest.test.tsx
        - web/src/pages/Vaults.test.tsx
        - web/e2e/vaults.spec.ts
      cloud:
        - services/cloud/internal/vaults/service_test.go

  - id: vault.system-trash
    title: Cestino di sistema per i file eliminati
    desktop:
      status: yes
      bindings: [VaultAPI.Trash]
      capability: osTrash
    workbench:
      status: exception
      reason: i file eliminati vanno in `.trash/` del vault, perché il browser non ha un cestino
    tests:
      desktop:
        - apps/desktop/internal/vault/fs_test.go

  - id: index.rebuild
    title: Ricostruzione dell'indice del vault
    desktop:
      status: yes
      commands: [index:rebuild]
      bindings: [VaultAPI.RebuildIndex]
    workbench:
      status: yes
    tests:
      desktop:
        - apps/desktop/internal/indexer/indexer_test.go
      workbench:
        - web/e2e/workbench.spec.ts

  - id: settings.vault
    title: Configurazione del vault (.memobrain/)
    desktop:
      status: yes
      bindings: [VaultAPI.ReadConfig, VaultAPI.WriteConfig]
    workbench:
      status: yes
    tests:
      desktop:
        - apps/desktop/internal/app/bindings_test.go
        - packages/workbench/src/workspace/layout.test.ts
        - apps/desktop/frontend/e2e/status-bar.spec.ts
      workbench:
        - apps/desktop/frontend/e2e/status-bar.spec.ts

  # ---- sincronizzazione ----------------------------------------------------------------------------
  - id: sync.link
    title: Collegamento di un vault locale a un vault cloud
    desktop:
      status: yes
      commands: [sync:connect]
      bindings: [SyncAPI.LinkExisting, SyncAPI.Info]
      operationIds: [getVaultTree]
    workbench:
      status: yes
      note: sul web il collegamento avviene da solo all'apertura del vault (web/src/workbench/launch.ts)
    tests:
      desktop:
        - packages/workbench/src/sync/sync.test.tsx
        - apps/desktop/internal/sync/manager_test.go
      workbench:
        - web/e2e-cloud/web-sync.spec.ts

  - id: sync.unlink
    title: Scollegamento di un vault dal cloud
    desktop:
      status: yes
      actions: [sync:unlink]
      bindings: [SyncAPI.Unlink]
      capability: unlinkVault
    workbench:
      status: exception
      reason: la copia nel browser appartiene al vault cloud e il lancio la ricollegherebbe; al posto di «Scollega» c'è «Rimuovi da questo browser», che carica le modifiche e cancella la copia quando il core la dice cancellabile (SyncAPI.CopyVerdict, web/src/workbench/guard.ts); uscire dal vault carica le modifiche e lascia nel marcatore ciò che resta, così «Esci» e «Dimentica questo browser» lo chiedono prima di cancellare
      actions: [sync:remove-from-browser]
      bindings: [SyncAPI.CopyVerdict]
    tests:
      desktop:
        - packages/workbench/src/sync/sync.test.tsx
        - apps/desktop/internal/sync/copies_test.go
      workbench:
        - web/src/workbench/guard.test.ts
        - web/src/workbench/forget.test.ts
      console:
        - web/src/layout/ForgetBrowser.test.tsx

  - id: sync.engine
    title: Sincronizzazione del vault (stato, pausa, sincronizza ora)
    desktop:
      status: yes
      note: Impostazioni › Sync mostra quanti file del cloud il dispositivo non riesce a leggere (quarantena, ADR-0039)
      commands: [sync:now, sync:settings]
      actions: [sync:pause]
      bindings: [SyncAPI.SyncNow, SyncAPI.Status, SyncAPI.SetPaused, SyncAPI.SetPollInterval]
      operationIds: [getChanges, checkBlobs, putBlob, getBlob, commit]
    workbench:
      status: yes
      note: le modifiche fatte offline restano in coda finché la scheda è aperta (ADR-0029)
    tests:
      desktop:
        - packages/workbench/src/sync/sync.test.tsx
        - apps/desktop/internal/sync/e2e_test.go
        - apps/desktop/internal/sync/push_test.go
        - apps/desktop/internal/sync/scan_test.go
      workbench:
        - web/e2e-cloud/web-sync.spec.ts
        - web/e2e-mixed/mixed.spec.ts
      cloud:
        - services/cloud/test/integration/sync_test.go
        - services/cloud/test/integration/tus_test.go

  - id: conflicts
    title: Conflitti di sincronizzazione
    desktop:
      status: yes
      note: se il file cambia dopo che le versioni sono state mostrate, «Tieni la mia» e la fusione non scrivono nulla, le versioni si ricaricano e un avviso chiede di scegliere di nuovo
      commands: [sync:conflicts]
      bindings: [SyncAPI.Conflicts, SyncAPI.ConflictTexts, SyncAPI.ResolveConflict]
    workbench:
      status: yes
      note: dal browser è provata solo la fusione di un `.md`, non la copia di conflitto di `.canvas` ed `.excalidraw`
    tests:
      desktop:
        - packages/workbench/src/sync/sync.test.tsx
        - packages/workbench/src/sync/diff.test.ts
        - apps/desktop/internal/sync/e2e_drawings_test.go
      workbench:
        - web/e2e-cloud/web-sync.spec.ts

  - id: revisions
    title: Storico delle revisioni nel cloud
    desktop:
      status: yes
      commands: [sync:history]
      bindings: [SyncAPI.History, SyncAPI.RevisionText, SyncAPI.RestoreRevision]
      operationIds: [listRevisions, getRevisionContent, restoreRevision]
    workbench:
      status: partial
      reason: 'non verificata sul web: nessun test apre lo storico delle revisioni dal browser; la UI e il codice Go sono quelli del desktop'
    tests:
      desktop:
        - packages/workbench/src/sync/sync.test.tsx
      cloud:
        - services/cloud/test/integration/history_test.go
        - services/cloud/internal/revisions/retention_test.go

  - id: history.local
    title: Storico locale delle note
    desktop:
      status: yes
      commands: [recovery:open]
      bindings:
        [
          HistoryAPI.List,
          HistoryAPI.Read,
          HistoryAPI.Restore,
          HistoryAPI.GetSettings,
          HistoryAPI.SetSettings,
        ]
    workbench:
      status: yes
    tests:
      desktop:
        - packages/workbench/src/recovery/recovery.test.tsx
        - apps/desktop/internal/history/history_test.go
        - apps/desktop/internal/app/bindings_history_test.go
      workbench:
        - web/e2e/workbench.spec.ts

  - id: trash
    title: File eliminati e loro ripristino
    desktop:
      status: yes
      commands: [recovery:deleted]
      bindings: [HistoryAPI.ListDeleted, HistoryAPI.Restore]
    workbench:
      status: partial
      reason: 'non verificata sul web: nessun test elenca o ripristina i file eliminati dal browser; la UI e il codice Go sono quelli del desktop'
    tests:
      desktop:
        - packages/workbench/src/recovery/recovery.test.tsx
        - apps/desktop/internal/history/history_test.go

  # ---- vault privati (E2EE) ----------------------------------------------------------------------
  - id: crypto.unlock
    title: Sblocco e blocco di un vault privato
    desktop:
      status: yes
      commands: [sync:unlock]
      actions: [vault:lock]
      bindings:
        [
          VaultCryptoAPI.Unlock,
          VaultCryptoAPI.Lock,
          VaultCryptoAPI.Activity,
          VaultCryptoAPI.SetPassphrase,
        ]
      operationIds: [getKeyEnvelopes]
    workbench:
      status: yes
      note: al blocco la copia in chiaro nel browser viene cancellata (ADR-0029); lo sblocco di una copia conservata (gate della pagina) chiede dopo la chiave di recupero una passphrase nuova con la stessa politica dei dialoghi (zxcvbn, §3.8.2)
    tests:
      desktop:
        - packages/workbench/src/sync/sync.test.tsx
        - packages/workbench/src/sync/strength.test.ts
        - apps/desktop/internal/crypto/crypto_test.go
        - apps/desktop/internal/sync/lock_test.go
      workbench:
        - web/src/workbench/overlay.test.ts
        - web/e2e-cloud/web-private.spec.ts
        - web/e2e-cloud/web-create-private.spec.ts
        - web/e2e-mixed/mixed.spec.ts
        - web/e2e/workbench.spec.ts

  - id: crypto.change-passphrase
    title: Cambio della passphrase di un vault privato
    desktop:
      status: yes
      bindings: [VaultCryptoAPI.ChangePassphrase]
      operationIds: [putKeyEnvelope]
    workbench:
      status: partial
      reason: 'non verificata sul web: nessun test cambia la passphrase dal browser; la UI e il codice Go sono quelli del desktop'
    tests:
      desktop:
        - apps/desktop/internal/crypto/crypto_test.go

  - id: crypto.recovery-key
    title: Nuova recovery key di un vault privato
    desktop:
      status: yes
      bindings: [VaultCryptoAPI.RegenerateRecoveryKey]
      operationIds: [putKeyEnvelope]
    workbench:
      status: partial
      reason: 'non verificata sul web: nessun test genera una nuova recovery key dal browser; la UI e il codice Go sono quelli del desktop'
    tests:
      desktop:
        - apps/desktop/internal/crypto/crypto_test.go

  - id: crypto.disk-check
    title: Avviso sul disco non cifrato
    desktop:
      status: yes
      capability: diskEncryptionCheck
      bindings: [VaultCryptoAPI.DiskEncryption]
    workbench:
      status: exception
      reason: nel browser non c'è un disco di cui parlare (il binding non viene chiamato)
    tests:
      desktop:
        - packages/workbench/src/sync/sync.test.tsx

  # ---- condivisione ------------------------------------------------------------------------------
  - id: share.create
    title: Creazione di una condivisione (vault, cartella o file)
    desktop:
      status: yes
      note: da Impostazioni → Condivisione («Nuova condivisione», un vault condiviso intero o una sua cartella, con @memobrain/cloud-features; «Condividi una parte» su una condivisione che l'utente gestisce come manager, solo dentro il suo ambito, ADR-0041 §8) e dal menu «Condividi…» dell'esplorazione (anche un documento del vault aperto; non sui mount)
      commands: [sharing:share]
      bindings: [SharingAPI.CreateShare, SharingAPI.CreateCloudShare]
      operationIds: [createShare]
    workbench:
      status: yes
    console:
      status: yes
      note: «Nuova condivisione» di un vault condiviso intero o di una sua cartella (la console non conosce gli id dei documenti); i vault privati non sono proposti (D-02); «Condividi una parte» per chi è manager di una condivisione di vault o cartella (ADR-0041 §8)
      routes: [/shares]
      operationIds: [createShare]
    tests:
      desktop:
        - packages/workbench/src/sharing/sharing.test.tsx
        - packages/workbench/src/cloud/CoreCloudPort.test.tsx
        - apps/desktop/internal/sync/manager_share_test.go
        - apps/desktop/internal/sync/e2e_sharing_test.go
        - apps/desktop/frontend/e2e/account-panels.spec.ts
      workbench:
        - packages/workbench/src/cloud/CoreCloudPort.core.test.tsx
        - apps/desktop/frontend/e2e/account-panels.spec.ts
      console:
        - packages/cloud-features/src/rest.test.tsx
        - web/src/pages/Shares.test.tsx
        - web/e2e/shares.spec.ts
      cloud:
        - services/cloud/test/integration/sharing_test.go
        - services/cloud/test/integration/sharing_manager_test.go
        - services/cloud/internal/access/access_test.go
        - services/cloud/internal/sharing/view_test.go

  - id: share.manage
    title: Elenco e revoca delle condivisioni create
    desktop:
      status: yes
      note: SharesManager di @memobrain/cloud-features, lo stesso componente della console; solo il proprietario revoca, un gestore no
      commands: [sharing:open]
      bindings:
        [SharingAPI.ListShares, SharingAPI.VaultShares, SharingAPI.Share, SharingAPI.RevokeShare]
      operationIds: [listShares, getShare, revokeShare]
    workbench:
      status: yes
    console:
      status: yes
      routes: [/shares]
      operationIds: [listShares, revokeShare]
    tests:
      desktop:
        - packages/workbench/src/sharing/sharing.test.tsx
        - packages/workbench/src/cloud/CoreCloudPort.test.tsx
        - apps/desktop/internal/sync/manager_share_test.go
        - apps/desktop/frontend/e2e/account-panels.spec.ts
      workbench:
        - packages/workbench/src/cloud/CoreCloudPort.core.test.tsx
        - apps/desktop/frontend/e2e/account-panels.spec.ts
      console:
        - packages/cloud-features/src/rest.test.tsx
        - web/src/pages/Shares.test.tsx
        - web/e2e/app.spec.ts
        - web/e2e/shares.spec.ts
      cloud:
        - services/cloud/test/integration/sharing_test.go

  - id: share.update
    title: Rinomina e scadenza di una condivisione
    desktop:
      status: yes
      note: «Modifica» di una condivisione (nome, scadenza o nessuna scadenza), proprietario o gestore
      bindings: [SharingAPI.UpdateShare]
      operationIds: [updateShare]
    workbench:
      status: yes
    console:
      status: yes
      routes: [/shares]
      operationIds: [updateShare]
    tests:
      desktop:
        - packages/workbench/src/sharing/sharing.test.tsx
        - packages/workbench/src/cloud/CoreCloudPort.test.tsx
        - apps/desktop/internal/sync/manager_share_test.go
        - apps/desktop/frontend/e2e/account-panels.spec.ts
