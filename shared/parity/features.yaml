        - web/e2e/app.spec.ts
      cloud:
        - services/cloud/internal/auth/verifier_test.go

  - id: account.session
    title: Accesso dal client e uscita (browser di sistema, scelta del server)
    desktop:
      status: yes
      actions: [account:sign-in, account:sign-out]
      bindings: [AuthAPI.Login, AuthAPI.Logout]
      capability: ownsSession
    workbench:
      status: exception
      reason: la sessione è quella OIDC della pagina, gestita dalla console (accesso e «Esci»); il workbench non offre login, logout né server
      actions: []
    console:
      status: yes
      note: accesso OIDC alla prima rotta protetta; «Esci» nell'intestazione carica e rimuove prima le copie dei vault nel browser e chiede conferma per quelle con modifiche non caricate (D-04)
      routes: [/auth/callback]
      actions: [sign-out]
    tests:
      desktop:
        - packages/workbench/src/settings/CloudSection.test.tsx
        - packages/workbench/src/shell/AccountButton.test.tsx
        - apps/desktop/internal/auth/auth_test.go
        - apps/desktop/internal/auth/hosted_test.go
      console:
        - web/src/auth/guards.test.tsx
        - web/src/layout/ForgetBrowser.test.tsx

  - id: account.forget-browser
    title: «Dimentica questo browser» (copie dei vault nel browser)
    desktop:
      status: exception
      reason: il desktop non tiene copie nel browser; le cartelle dei vault restano dell'utente, e un dispositivo si revoca da Impostazioni › Cloud
    workbench:
      status: console-only
      reason: azione della pagina Account della console; un workbench aperto in un'altra scheda carica le modifiche ed esce prima che le copie si cancellino
    console:
      status: yes
      note: le copie con modifiche non caricate si elencano e si cancellano solo con una conferma (marcatori, D-04); la registrazione del dispositivo resta in IndexedDB (ADR-0029)
      routes: [/account]
      actions: [forget-browser]
    tests:
      workbench:
        - web/src/workbench/forget.test.ts
        - web/e2e/workbench.spec.ts
      console:
        - web/src/layout/ForgetBrowser.test.tsx
        - web/src/pages/Account.test.tsx
        - web/e2e/workbench.spec.ts

