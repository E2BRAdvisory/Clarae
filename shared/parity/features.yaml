  - id: mounts
    title: Mount delle condivisioni ricevute
    desktop:
      status: yes
      note: MountsList di @memobrain/cloud-features (lo stesso elenco della console, ADR-0045 §7) con le azioni del workbench nel suo spazio; alla revoca la copia si elimina o si conserva come vault ordinario (capability detachedCopies)
      actions: [mount:open, mount:remove, mount:delete-copy, mount:keep-copy]
      bindings: [SharingAPI.Mounts, SharingAPI.OpenMount, SharingAPI.RemoveMount]
      operationIds: [listSharedWithMe]
    workbench:
      status: partial
      actions: [mount:open, mount:remove, mount:delete-copy, mount:download-copy]
      reason: un mount si apre nella sua pagina (/vaults/:id/open?share=, anche da Impostazioni › Condivisione, attraverso il guard e i marcatori dell'host); la copia di un mount revocato non si conserva come cartella (nel browser nessuno potrebbe riaprirla) ma si scarica come ZIP (capability detachedCopies)
    console:
      status: yes
      note: MountsList (GET /shared-with-me) su «I miei vault» e, come «Condivisioni accettate», in InvitationsList; «Apri» apre il workbench sul mount
