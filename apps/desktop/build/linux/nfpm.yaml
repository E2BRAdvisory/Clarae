# nfpm recipe for the .deb (scripts/release/package-linux.sh deb <version>).
# Environment: VERSION (semver; nfpm turns "-rc.1" into "~rc.1"), ARCH (amd64|arm64), STAGE (directory
# with clarae, clarae.desktop, dev.clarae.desktop.metainfo.xml, clarae.png/.svg prepared by the script).
name: clarae
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Clarae notanda <efrem.ropelato@e2br-advisory.ch>
description: |
  Your knowledge, carefully preserved in its clarity.
  Notes are ordinary Markdown files; optional cloud sync with end-to-end encryption.
homepage: https://github.com/E2BR/MemoBrain
license: Proprietary
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
# The package of 1.x had another name and installed /usr/bin/<its name>, its .desktop file and its icons:
# installing this one removes it (dpkg Replaces + Conflicts), and neither of the two stays next to the other.
# The data of the user is not in the package: the application takes over the data directory at its first start.
# Dropped in 2.0.
replaces:
  - memobrain
conflicts:
  - memobrain
contents:
  - src: ${STAGE}/clarae
    dst: /usr/bin/clarae
    file_info:
      mode: 0755
  - src: ${STAGE}/clarae.desktop
    dst: /usr/share/applications/clarae.desktop
  - src: ${STAGE}/dev.clarae.desktop.metainfo.xml
    dst: /usr/share/metainfo/dev.clarae.desktop.metainfo.xml
  - src: ${STAGE}/clarae.png
    dst: /usr/share/icons/hicolor/512x512/apps/clarae.png
  - src: ${STAGE}/clarae.svg
    dst: /usr/share/icons/hicolor/scalable/apps/clarae.svg
scripts:
  postinstall: apps/desktop/build/linux/postinst.sh
  postremove: apps/desktop/build/linux/postinst.sh
