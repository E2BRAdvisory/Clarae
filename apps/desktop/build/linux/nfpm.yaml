# nfpm recipe for the .deb (scripts/release/package-linux.sh deb <version>).
# Environment: VERSION (semver; nfpm turns "-rc.1" into "~rc.1"), ARCH (amd64|arm64), STAGE (directory
# with nodus, nodus.desktop, dev.nodus.desktop.metainfo.xml, nodus.png prepared by the script).
name: nodus
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Nodus <efrem.ropelato@e2br-advisory.ch>
description: |
  Local-first notes and knowledge base.
  Notes are ordinary Markdown files; optional cloud sync with end-to-end encryption.
homepage: https://nodus.example
license: Proprietary
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
contents:
  - src: ${STAGE}/nodus
    dst: /usr/bin/nodus
    file_info:
      mode: 0755
  - src: ${STAGE}/nodus.desktop
    dst: /usr/share/applications/nodus.desktop
  - src: ${STAGE}/dev.nodus.desktop.metainfo.xml
    dst: /usr/share/metainfo/dev.nodus.desktop.metainfo.xml
  - src: ${STAGE}/nodus.png
    dst: /usr/share/icons/hicolor/512x512/apps/nodus.png
scripts:
  postinstall: apps/desktop/build/linux/postinst.sh
  postremove: apps/desktop/build/linux/postinst.sh
